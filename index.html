// ══════════════════════════════════════════════════════
// ECG WAVEFORMS
// ══════════════════════════════════════════════════════
function gauss(x,c,w,a){ return a*Math.exp(-Math.pow((x-c)/w,2)); }

function ecgSinusal(p){ return gauss(p,0.080,0.024,0.14)+gauss(p,0.192,0.007,-0.12)+gauss(p,0.208,0.011,1.00)+gauss(p,0.226,0.007,-0.28)+gauss(p,0.420,0.068,0.27); }
function ecgAfib(p){ const f=0.030*Math.sin(p*Math.PI*14)+0.018*Math.sin(p*Math.PI*23+0.9)+0.012*Math.sin(p*Math.PI*34+2.0); return f+gauss(p,0.192,0.007,-0.12)+gauss(p,0.208,0.011,1.00)+gauss(p,0.226,0.007,-0.28)+gauss(p,0.420,0.062,0.22); }
function ecgFlutter(p){ const f=0.15*Math.sin(p*Math.PI*4-0.5)+0.08*Math.sin(p*Math.PI*8); return f+gauss(p,0.208,0.011,0.90)+gauss(p,0.226,0.007,-0.25)+gauss(p,0.420,0.060,0.20); }
function ecgVtach(p){ return gauss(p,0.18,0.025,-0.22)+gauss(p,0.26,0.028,0.88)+gauss(p,0.34,0.022,-0.48)+gauss(p,0.52,0.090,-0.20); }
function ecgMarcap(p){ const s=(p>=0.17&&p<0.178)?2.0:0; return s+gauss(p,0.22,0.022,0.72)+gauss(p,0.30,0.018,-0.38)+gauss(p,0.50,0.080,-0.18); }

function calSignal(phase,mode,amp){
  switch(mode){
    case 'cuadrada':  return phase<0.5?amp:0;
    case 'senoidal':  return amp*Math.sin(phase*2*Math.PI);
    case 'triangular':
      if(phase<0.25) return amp*(phase/0.25);
      if(phase<0.75) return amp*(1-(phase-0.25)/0.25);
      return amp*(-1+(phase-0.75)/0.25);
    default: return 0;
  }
}

function getECGSample(phase, rhythm, mode, amp, stMV){
  if(mode!=='cardiaco') return calSignal(phase,mode,amp);
  let base;
  switch(rhythm){
    case 'sinusal':   base=ecgSinusal(phase)*amp; break;
    case 'afib':      base=ecgAfib(phase)*amp; break;
    case 'flutter':   base=ecgFlutter(phase)*amp; break;
    case 'vtach':     base=ecgVtach(phase)*amp; break;
    case 'vfib':      return (Math.random()-0.5)*1.4*amp;
    case 'asistolia': return 0;
    case 'marcap':    base=ecgMarcap(phase)*amp; break;
    default:          base=ecgSinusal(phase)*amp;
  }
  if(stMV!==0&&rhythm!=='vfib'&&rhythm!=='asistolia'){
    if(phase>0.235&&phase<0.385){
      const fade=Math.min(1,Math.min((phase-0.235)/0.025,(0.385-phase)/0.025));
      base+=stMV*fade;
    }
  }
  return base;
}

function getPleth(p, rhythm, spo2){
  if(rhythm==='vfib'||rhythm==='asistolia') return 0;
  let v;
  if(p<0.28) v=Math.pow(Math.sin((p/0.28)*Math.PI/2),2);
  else v=Math.pow(Math.cos(((p-0.28)/0.72)*Math.PI/2),1.5)*0.38;
  return v*(spo2/100);
}

// ══════════════════════════════════════════════════════
// CANVAS
// ══════════════════════════════════════════════════════
function drawWave(canvas, buf, color, label, yMin, yMax){
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;
  const pL=4,pR=4,pT=5,pB=14,pH=H-pT-pB,pW=W-pL-pR;
  ctx.fillStyle='#07090F'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.035)'; ctx.lineWidth=1;
  for(let i=1;i<4;i++){const y=pT+(i/4)*pH;ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(W-pR,y);ctx.stroke();}
  for(let i=1;i<8;i++){const x=pL+(i/8)*pW;ctx.beginPath();ctx.moveTo(x,pT);ctx.lineTo(x,pT+pH);ctx.stroke();}
  ctx.fillStyle=`${color}66`; ctx.font='8px Space Mono,monospace'; ctx.textAlign='left'; ctx.fillText(label,pL+3,H-3);
  if(buf.length<2)return;
  const sy=v=>pT+pH*(1-(v-yMin)/(yMax-yMin));
  ctx.save(); ctx.shadowBlur=9; ctx.shadowColor=color; ctx.strokeStyle=color; ctx.lineWidth=1.8; ctx.lineJoin='round'; ctx.beginPath();
  buf.forEach((v,i)=>{ const x=pL+i,y=Math.max(pT,Math.min(pT+pH,sy(v))); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke(); ctx.restore();
  if(buf.length>0){
    const hx=pL+buf.length-1,hy=Math.max(pT,Math.min(pT+pH,sy(buf[buf.length-1])));
    ctx.save(); ctx.beginPath(); ctx.arc(hx,hy,2.5,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.shadowBlur=10; ctx.shadowColor=color; ctx.fill(); ctx.restore();
  }
}

function WaveCanvas({vitals,rhythm,running,type,ecgMode,amplitude,stOffset}){
  const canvasRef=useRef(null);
  const buf=useRef([]),phase=useRef(Math.random()*0.3),rr=useRef(1.0),lastT=useRef(null),raf=useRef(null);
  const p=useRef({vitals,rhythm,running,ecgMode,amplitude,stOffset});
  useEffect(()=>{p.current={vitals,rhythm,running,ecgMode,amplitude,stOffset};},[vitals,rhythm,running,ecgMode,amplitude,stOffset]);
  useEffect(()=>{
    const canvas=canvasRef.current; if(!canvas)return;
    const loop=()=>{
      const{vitals,rhythm,running,ecgMode,amplitude,stOffset}=p.current;
      const now=performance.now();
      if(!lastT.current)lastT.current=now;
      const dt=Math.min((now-lastT.current)/1000,0.05); lastT.current=now;
      const pW=canvas.width-8;
      if(running){
        const hr=Math.max(1,vitals.hr||60),ct=60/hr;
        phase.current+=dt/(rr.current*ct);
        if(phase.current>=1){
          phase.current-=1;
          rr.current=rhythm==='afib'?(0.60+Math.random()*0.80):rhythm==='flutter'?0.5:1.0;
        }
        const v=type==='ecg'?getECGSample(phase.current,rhythm,ecgMode,amplitude,stOffset):getPleth(phase.current,rhythm,vitals.spo2);
        buf.current.push(v);
      } else { buf.current.push(0); }
      if(buf.current.length>pW) buf.current.shift();
      if(type==='ecg'){
        const yMax=2.6*amplitude+0.3,yMin=-0.5*amplitude-0.1;
        const col=ecgMode!=='cardiaco'?'#F5A623':'#00C896';
        const lbl=ecgMode!=='cardiaco'?`CAL ${ecgMode.toUpperCase()}`:'ECG II';
        drawWave(canvas,buf.current,col,lbl,yMin,yMax);
      } else {
        const c=vitals.spo2<90?'#E63946':vitals.spo2<95?'#F5A623':'#00BFFF';
        drawWave(canvas,buf.current,c,'PLETH',-0.05,1.05);
      }
      raf.current=requestAnimationFrame(loop);
    };
    raf.current=requestAnimationFrame(loop);
    return()=>{cancelAnimationFrame(raf.current);lastT.current=null;};
  },[type]);
  const h=type==='ecg'?110:72;
  return <canvas ref={canvasRef} width={540} height={h} style={{width:'100%',height:h+'px',display:'block'}}/>;
}

// ══════════════════════════════════════════════════════
// WIFI
// ══════════════════════════════════════════════════════
function WiFiPanel({vitals,rhythm,ecgMode,amplitude,stOffset}){
  const [ip,setIp]=useState('192.168.4.1');
  const [connected,setConnected]=useState(false);
  const [status,setStatus]=useState('Sin conexión');
  const ws=useRef(null),ref=useRef({vitals,rhythm,ecgMode,amplitude,stOffset});
  useEffect(()=>{ref.current={vitals,rhythm,ecgMode,amplitude,stOffset};},[vitals,rhythm,ecgMode,amplitude,stOffset]);
  const connect=()=>{
    try{
      const sock=new WebSocket(`ws://${ip}/ws`);
      sock.onopen=()=>{setConnected(true);setStatus(`Conectado @ ${ip}`);};
      sock.onclose=()=>{setConnected(false);setStatus('Desconectado');};
      sock.onerror=()=>setStatus('Error de conexión');
      ws.current=sock;
      sock._iv=setInterval(()=>{ if(sock.readyState===WebSocket.OPEN) sock.send(JSON.stringify({...ref.current,ts:Date.now()})); },500);
    }catch(e){setStatus('Error: '+e.message);}
  };
  const disconnect=()=>{ if(ws.current){clearInterval(ws.current._iv);ws.current.close();ws.current=null;} setConnected(false);setStatus('Sin conexión'); };
  return(
    <div style={{background:'rgba(0,0,0,0.4)',border:'1px solid rgba(255,255,255,0.06)',borderRadius:6,padding:10}}>
      <div style={{fontFamily:'Space Mono,monospace',fontSize:8,letterSpacing:'0.14em',color:'rgba(0,200,150,0.45)',marginBottom:8}}>ESP32 — WiFi</div>
      <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:5}}>
        <div style={{width:7,height:7,borderRadius:'50%',background:connected?'#00C896':'#333',boxShadow:connected?'0 0 7px #00C896':'none',flexShrink:0}}/>
        <input value={ip} onChange={e=>setIp(e.target.value)} disabled={connected}
          style={{flex:1,background:'rgba(0,0,0,0.5)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:4,color:'rgba(0,200,150,0.85)',fontFamily:'Space Mono,monospace',fontSize:11,padding:'4px 7px',outline:'none'}}/>
        <button onClick={connected?disconnect:connect}
          style={{padding:'4px 10px',fontSize:10,fontFamily:'Space Mono,monospace',background:connected?'rgba(230,57,70,0.15)':'rgba(0,200,150,0.15)',color:connected?'#E63946':'#00C896',border:`1px solid ${connected?'#E63946':'#00C896'}`,borderRadius:4,cursor:'pointer'}}>
          {connected?'DESCON.':'CONECT.'}
        </button>
      </div>
      <div style={{fontFamily:'Space Mono,monospace',fontSize:9,color:'rgba(255,255,255,0.22)'}}>{status}</div>
    </div>
  );
}

function calcStat(errors){
  if(!errors.length)return null;
  const m=errors.reduce((a,b)=>a+b,0)/errors.length;
  const sd=Math.sqrt(errors.reduce((a,b)=>a+Math.pow(b-m,2),0)/errors.length);
  return{mean:m,sd,passM:Math.abs(m)<=5,passSd:sd<=8,pass:Math.abs(m)<=5&&sd<=8};
}
const errClr=v=>{const a=Math.abs(v);return a<=3?'#00C896':a<=8?'#F5A623':'#E63946';};
const fmt=(v,d=1)=>isNaN(v)?'—':`${v>0?'+':''}${v.toFixed(d)}`;
const INP={padding:'7px 8px',border:'1px solid #E2E8F0',borderRadius:6,fontSize:13,fontFamily:'Space Mono,monospace',outline:'none',width:'100%'};
const LBL={fontSize:11,color:'#5A6B7E',fontWeight:500,display:'block',marginBottom:3};
const SEC={fontSize:11,fontWeight:600,color:'#5A6B7E',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:8};

function VerifTab({vitals}){
  const [param,setParam]=useState('nibp');
  const [meas,setMeas]=useState([]);
  const [e,setE]=useState({tSys:'',tDia:'',mSys:'',mDia:'',tSpo2:'',mSpo2:'',tTemp:'',mTemp:'',tHr:'',mHr:''});
  useEffect(()=>{ setE(prev=>({...prev,tSys:String(vitals.sys),tDia:String(vitals.dia),tSpo2:String(vitals.spo2),tTemp:String(vitals.temp),tHr:String(vitals.hr)})); },[vitals]);
  const add=()=>{ setMeas(prev=>[...prev,{id:Date.now(),param,...e}]); setE(prev=>({...prev,mSys:'',mDia:'',mSpo2:'',mTemp:'',mHr:''})); };
  const del=id=>setMeas(prev=>prev.filter(m=>m.id!==id));
  const fil=meas.filter(m=>m.param===param);
  const sysErrs=fil.map(m=>parseFloat(m.mSys)-parseFloat(m.tSys)).filter(v=>!isNaN(v));
  const diaErrs=fil.map(m=>parseFloat(m.mDia)-parseFloat(m.tDia)).filter(v=>!isNaN(v));
  const spo2Errs=fil.map(m=>parseFloat(m.mSpo2)-parseFloat(m.tSpo2)).filter(v=>!isNaN(v));
  const tempErrs=fil.map(m=>parseFloat(m.mTemp)-parseFloat(m.tTemp)).filter(v=>!isNaN(v));
  const hrErrs=fil.map(m=>parseFloat(m.mHr)-parseFloat(m.tHr)).filter(v=>!isNaN(v));
  const TabBtn=({id,lbl})=>(<button onClick={()=>setParam(id)} style={{padding:'5px 14px',fontSize:12,fontWeight:500,borderRadius:100,cursor:'pointer',border:param===id?'none':'1px solid #E2E8F0',background:param===id?'#00C896':'white',color:param===id?'white':'#5A6B7E'}}>{lbl}</button>);
  const Th=({c})=><th style={{padding:'6px 8px',fontSize:10,fontWeight:600,color:'#5A6B7E',textTransform:'uppercase',textAlign:'center'}}>{c}</th>;
  const Td=({c,s})=><td style={{padding:'6px 8px',textAlign:'center',fontFamily:'Space Mono,monospace',fontSize:12,...s}}>{c}</td>;
  const StatCard=({s,label,unit,crit})=>{
    if(!s)return null;
    return(<div style={{background:'white',border:'1px solid #E2E8F0',borderRadius:8,padding:14,marginTop:12}}>
      <div style={{...SEC,marginBottom:10}}>Estadísticas {label} — {crit}</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}}>
        {[{l:'Error medio',v:fmt(s.mean),ok:s.passM,c:'≤ ±5'},{l:'Desv. estándar',v:fmt(s.sd),ok:s.passSd,c:'≤ 8'}].map(x=>(
          <div key={x.l}><div style={{fontSize:10,color:'#aaa',textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:2}}>{x.l}</div>
          <div style={{fontFamily:'Space Mono,monospace',fontSize:20,fontWeight:700,color:x.ok?'#00C896':'#E63946'}}>{x.v} <span style={{fontSize:10}}>{unit}</span></div>
          <div style={{fontSize:10,color:'#aaa'}}>criterio {x.c} {unit}</div></div>
        ))}
      </div>
      <div style={{padding:'10px 14px',borderRadius:6,display:'flex',alignItems:'center',gap:10,background:s.pass?'rgba(0,200,150,0.08)':'rgba(230,57,70,0.08)',border:`1px solid ${s.pass?'rgba(0,200,150,0.3)':'rgba(230,57,70,0.3)'}`}}>
        <span style={{fontSize:18}}>{s.pass?'✅':'❌'}</span>
        <div><div style={{fontWeight:700,color:s.pass?'#00C896':'#E63946'}}>{s.pass?'APROBADO':'REPROBADO'}</div>
        <div style={{fontSize:11,color:'#aaa'}}>n={fil.length}{fil.length<5?' · ⚠ mínimo recomendado: 5':''}</div></div>
      </div>
    </div>);
  };
  return(<div>
    <div style={{display:'flex',gap:6,marginBottom:16,flexWrap:'wrap'}}>
      <TabBtn id="nibp" lbl="NIBP"/><TabBtn id="spo2" lbl="SpO₂"/><TabBtn id="temp" lbl="Temperatura"/><TabBtn id="hr" lbl="FC"/>
    </div>
    <div style={{background:'white',border:'1px solid #E2E8F0',borderRadius:8,padding:14,marginBottom:14}}>
      <div style={{...SEC,marginBottom:10}}>Nueva medición</div>
      {param==='nibp'&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr auto',gap:8,alignItems:'end'}}>
        {[['tSys','T-SYS'],['tDia','T-DIA'],['mSys','M-SYS'],['mDia','M-DIA']].map(([k,lbl])=>(<div key={k}><label style={LBL}>{lbl}</label><input type="number" value={e[k]} onChange={ev=>setE({...e,[k]:ev.target.value})} style={INP}/></div>))}
        <button onClick={add} style={{padding:'7px 14px',background:'#00C896',color:'white',border:'none',borderRadius:6,fontSize:14,cursor:'pointer',fontWeight:700,height:34,alignSelf:'end'}}>+</button>
      </div>}
      {param==='spo2'&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr auto',gap:8,alignItems:'end'}}>
        {[['tSpo2','Target SpO₂ (%)'],['mSpo2','Medido SpO₂ (%)']].map(([k,lbl])=>(<div key={k}><label style={LBL}>{lbl}</label><input type="number" value={e[k]} onChange={ev=>setE({...e,[k]:ev.target.value})} style={INP}/></div>))}
        <button onClick={add} style={{padding:'7px 14px',background:'#00C896',color:'white',border:'none',borderRadius:6,fontSize:14,cursor:'pointer',fontWeight:700,height:34,alignSelf:'end'}}>+</button>
      </div>}
      {param==='temp'&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr auto',gap:8,alignItems:'end'}}>
        {[['tTemp','Referencia (°C)'],['mTemp','Monitor (°C)']].map(([k,lbl])=>(<div key={k}><label style={LBL}>{lbl}</label><input type="number" step="0.1" value={e[k]} onChange={ev=>setE({...e,[k]:ev.target.value})} style={INP}/></div>))}
        <button onClick={add} style={{padding:'7px 14px',background:'#00C896',color:'white',border:'none',borderRadius:6,fontSize:14,cursor:'pointer',fontWeight:700,height:34,alignSelf:'end'}}>+</button>
      </div>}
      {param==='hr'&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr auto',gap:8,alignItems:'end'}}>
        {[['tHr','Target FC'],['mHr','Medido FC']].map(([k,lbl])=>(<div key={k}><label style={LBL}>{lbl}</label><input type="number" value={e[k]} onChange={ev=>setE({...e,[k]:ev.target.value})} style={INP}/></div>))}
        <button onClick={add} style={{padding:'7px 14px',background:'#00C896',color:'white',border:'none',borderRadius:6,fontSize:14,cursor:'pointer',fontWeight:700,height:34,alignSelf:'end'}}>+</button>
      </div>}
    </div>
    {fil.length>0&&<div style={{background:'white',border:'1px solid #E2E8F0',borderRadius:8,overflow:'hidden',marginBottom:4}}>
      <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
        <thead><tr style={{background:'#F8F9FB'}}>
          <Th c="#"/>
          {param==='nibp'&&<><Th c="T-SYS"/><Th c="T-DIA"/><Th c="M-SYS"/><Th c="M-DIA"/><Th c="Δ SYS"/><Th c="Δ DIA"/></>}
          {param==='spo2'&&<><Th c="Target"/><Th c="Medido"/><Th c="Δ"/></>}
          {param==='temp'&&<><Th c="Ref."/><Th c="Monitor"/><Th c="Δ"/></>}
          {param==='hr'&&<><Th c="Target"/><Th c="Medido"/><Th c="Δ"/></>}
          <Th c=""/>
        </tr></thead>
        <tbody>{fil.map((m,i)=>{
          const sE=parseFloat(m.mSys)-parseFloat(m.tSys),dE=parseFloat(m.mDia)-parseFloat(m.tDia);
          const spE=parseFloat(m.mSpo2)-parseFloat(m.tSpo2),tpE=parseFloat(m.mTemp)-parseFloat(m.tTemp),hrE=parseFloat(m.mHr)-parseFloat(m.tHr);
          return(<tr key={m.id} style={{borderTop:'1px solid #F0F0F0'}}>
            <Td c={i+1} s={{textAlign:'left',paddingLeft:12,color:'#aaa'}}/>
            {param==='nibp'&&<><Td c={m.tSys}/><Td c={m.tDia}/><Td c={m.mSys} s={{fontWeight:700}}/><Td c={m.mDia} s={{fontWeight:700}}/><Td c={fmt(sE)} s={{fontWeight:600,color:errClr(sE)}}/><Td c={fmt(dE)} s={{fontWeight:600,color:errClr(dE)}}/></>}
            {param==='spo2'&&<><Td c={m.tSpo2+'%'}/><Td c={m.mSpo2+'%'} s={{fontWeight:700}}/><Td c={fmt(spE)+'%'} s={{fontWeight:600,color:errClr(spE*3)}}/></>}
            {param==='temp'&&<><Td c={m.tTemp+'°C'}/><Td c={m.mTemp+'°C'} s={{fontWeight:700}}/><Td c={fmt(tpE,2)+'°C'} s={{fontWeight:600,color:errClr(Math.abs(tpE)*15)}}/></>}
            {param==='hr'&&<><Td c={m.tHr}/><Td c={m.mHr} s={{fontWeight:700}}/><Td c={fmt(hrE)} s={{fontWeight:600,color:errClr(hrE)}}/></>}
            <td style={{padding:'6px 8px',textAlign:'center'}}><button onClick={()=>del(m.id)} style={{background:'none',border:'none',cursor:'pointer',color:'#ccc',fontSize:18,lineHeight:1}}>×</button></td>
          </tr>);
        })}</tbody>
      </table>
    </div>}
    {param==='nibp'&&sysErrs.length>0&&<StatCard s={{...calcStat(sysErrs),pass:calcStat(sysErrs)?.pass&&calcStat(diaErrs)?.pass}} label="NIBP" unit="mmHg" crit="AAMI SP10 / ISO 81060-2"/>}
    {param==='spo2'&&spo2Errs.length>0&&<StatCard s={calcStat(spo2Errs)} label="SpO₂" unit="%" crit="ISO 9919"/>}
    {param==='temp'&&tempErrs.length>0&&<StatCard s={calcStat(tempErrs)} label="Temperatura" unit="°C" crit="IEC 60601-2-56"/>}
    {param==='hr'&&hrErrs.length>0&&<StatCard s={calcStat(hrErrs)} label="FC" unit="bpm" crit="Tol. ±3 bpm"/>}
    {fil.length===0&&<div style={{textAlign:'center',padding:30,color:'#aaa',fontSize:14}}>Sin mediciones para {param.toUpperCase()}.</div>}
  </div>);
}

// ══════════════════════════════════════════════════════
// CALIBRACIÓN
// ══════════════════════════════════════════════════════
const PARAM_CFG = {
  nibp: { label:'Presión (NIBP)', unit:'mmHg', tipo:'offset', norma:'AAMI SP10', tol:2, nomLabel:'Nominal (mmHg)', refLabel:'Referencia patrón (mmHg)' },
  temp: { label:'Temperatura',   unit:'°C',   tipo:'offset', norma:'IEC 60601-2-56', tol:0.2, nomLabel:'Nominal (°C)', refLabel:'Referencia patrón (°C)', step:0.01 },
  ecg:  { label:'ECG Amplitud',  unit:'mV',   tipo:'gain',   norma:'IEC 60601-2-25', tol:0.05, nomLabel:'Nominal (mV)', refLabel:'Medido instrumento (mV)', step:0.01 },
  spo2: { label:'SpO₂',          unit:'%',    tipo:'offset', norma:'ISO 9919', tol:2, nomLabel:'Nominal (%)', refLabel:'Referencia patrón (%)' },
};

function CalibrationTab({ cal, setCal }){
  const [param,setParam]=useState('nibp');
  const [entry,setEntry]=useState({nominal:'',reference:''});
  const cfg=PARAM_CFG[param];
  const p=cal[param];

  const setInstr=(k,v)=>setCal(prev=>({...prev,[param]:{...prev[param],instrument:{...prev[param].instrument,[k]:v}}}));
  const setMeta=(k,v)=>setCal(prev=>({...prev,[param]:{...prev[param],[k]:v}}));

  const addPoint=()=>{
    const nom=parseFloat(entry.nominal),ref=parseFloat(entry.reference);
    if(isNaN(nom)||isNaN(ref))return;
    const error=ref-nom;
    setCal(prev=>({...prev,[param]:{...prev[param],points:[...prev[param].points,{id:Date.now(),nominal:nom,reference:ref,error}]}}));
    setEntry({nominal:'',reference:''});
  };

  const removePoint=id=>setCal(prev=>({...prev,[param]:{...prev[param],points:prev[param].points.filter(pt=>pt.id!==id)}}));

  const applyCorrection=()=>{
    if(!p.points.length)return;
    if(cfg.tipo==='gain'){
      const gain=p.points.reduce((a,pt)=>a+pt.reference/pt.nominal,0)/p.points.length;
      setCal(prev=>({...prev,[param]:{...prev[param],gain:parseFloat(gain.toFixed(4)),applied:true,date:new Date().toISOString().split('T')[0]}}));
    } else {
      const offset=p.points.reduce((a,pt)=>a+pt.error,0)/p.points.length;
      setCal(prev=>({...prev,[param]:{...prev[param],offset:parseFloat(offset.toFixed(3)),applied:true,date:new Date().toISOString().split('T')[0]}}));
    }
  };

  const clearCorrection=()=>setCal(prev=>({...prev,[param]:{...defaultCalParam}}));
  const toggleApply=()=>setCal(prev=>({...prev,[param]:{...prev[param],applied:!prev[param].applied}}));

  const meanError=p.points.length?p.points.reduce((a,pt)=>a+pt.error,0)/p.points.length:null;
  const maxError=p.points.length?Math.max(...p.points.map(pt=>Math.abs(pt.error))):null;
  const correction=cfg.tipo==='gain'
    ?(p.points.length?p.points.reduce((a,pt)=>a+pt.reference/pt.nominal,0)/p.points.length:null)
    :meanError;

  const calOK=maxError!==null&&maxError<=cfg.tol*3;

  // Status badge for each param
  const ParamStatus=({id})=>{
    const c=cal[id];
    const ok=c.applied&&c.date;
    return(
      <span style={{fontSize:9,fontFamily:'Space Mono,monospace',padding:'2px 6px',borderRadius:3,background:ok?'rgba(0,200,150,0.15)':'rgba(100,100,100,0.1)',color:ok?'#00C896':'#aaa',marginLeft:4}}>
        {ok?'✓ CAL':'—'}
      </span>
    );
  };

  return(
    <div>
      {/* Overall status banner */}
      {(() => {
        const allCal=['nibp','temp','ecg','spo2'].every(k=>cal[k].applied&&cal[k].date);
        const anyCal=['nibp','temp','ecg','spo2'].some(k=>cal[k].applied);
        return(
          <div style={{marginBottom:16,padding:'12px 14px',borderRadius:8,border:`1px solid ${allCal?'rgba(0,200,150,0.3)':anyCal?'rgba(245,166,35,0.3)':'rgba(100,100,100,0.2)'}`,background:allCal?'rgba(0,200,150,0.06)':anyCal?'rgba(245,166,35,0.06)':'rgba(0,0,0,0.03)',display:'flex',alignItems:'center',gap:12}}>
            <span style={{fontSize:22}}>{allCal?'✅':anyCal?'⚠️':'⭕'}</span>
            <div>
              <div style={{fontWeight:600,fontSize:13,color:allCal?'#00C896':anyCal?'#F5A623':'#5A6B7E'}}>
                {allCal?'Simulador calibrado — todos los parámetros':anyCal?'Calibración parcial':'Sin calibración aplicada'}
              </div>
              <div style={{fontSize:11,color:'#5A6B7E',marginTop:2}}>
                {['nibp','temp','ecg','spo2'].map(k=>(
                  <span key={k} style={{marginRight:10,color:cal[k].applied?'#00C896':'#aaa'}}>
                    {PARAM_CFG[k].label.split(' ')[0]}: {cal[k].applied?(cal[k].date||'aplicado'):'—'}
                  </span>
                ))}
              </div>
            </div>
          </div>
        );
      })()}

      {/* Param selector */}
      <div style={{display:'flex',gap:6,marginBottom:16,flexWrap:'wrap'}}>
        {Object.entries(PARAM_CFG).map(([id,c])=>(
          <button key={id} onClick={()=>setParam(id)} style={{padding:'6px 14px',fontSize:12,fontWeight:500,borderRadius:6,cursor:'pointer',border:param===id?'none':'1px solid #E2E8F0',background:param===id?'#1B2A3B':'white',color:param===id?'#00C896':'#5A6B7E',display:'flex',alignItems:'center',gap:4}}>
            {c.label}<span style={{fontSize:9,fontFamily:'Space Mono,monospace',padding:'1px 5px',borderRadius:3,background:cal[id].applied?'rgba(0,200,150,0.2)':'rgba(0,0,0,0.05)',color:cal[id].applied?'#00C896':'#aaa'}}>{cal[id].applied?'CAL':'—'}</span>
          </button>
        ))}
      </div>

      {/* Instrument reference */}
      <div style={{background:'white',border:'1px solid #E2E8F0',borderRadius:8,padding:14,marginBottom:14}}>
        <div style={{...SEC,marginBottom:10}}>Instrumento patrón — {cfg.label}</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:10}}>
          {[['marca','Marca'],['modelo','Modelo'],['serie','N° Serie']].map(([k,lbl])=>(
            <div key={k}><label style={LBL}>{lbl}</label><input value={p.instrument[k]||''} onChange={ev=>setInstr(k,ev.target.value)} style={{...INP,fontFamily:'Inter,sans-serif'}}/></div>
          ))}
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {[['cert','N° Certificado'],['trazabilidad','Trazabilidad']].map(([k,lbl])=>(
            <div key={k}><label style={LBL}>{lbl}</label><input value={p.instrument[k]||''} onChange={ev=>setInstr(k,ev.target.value)} style={{...INP,fontFamily:'Inter,sans-serif'}}/></div>
          ))}
        </div>
      </div>

      {/* Measurement points */}
      <div style={{background:'white',border:'1px solid #E2E8F0',borderRadius:8,padding:14,marginBottom:14}}>
        <div style={{...SEC,marginBottom:10}}>Puntos de calibración · tolerancia: ±{cfg.tol} {cfg.unit}</div>

        {/* Entry */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr auto',gap:8,alignItems:'end',marginBottom:14}}>
          <div><label style={LBL}>{cfg.nomLabel}</label><input type="number" step={cfg.step||1} value={entry.nominal} onChange={ev=>setEntry({...entry,nominal:ev.target.value})} style={INP}/></div>
          <div><label style={LBL}>{cfg.refLabel}</label><input type="number" step={cfg.step||0.1} value={entry.reference} onChange={ev=>setEntry({...entry,reference:ev.target.value})} onKeyDown={ev=>ev.key==='Enter'&&addPoint()} style={INP}/></div>
          <button onClick={addPoint} style={{padding:'7px 14px',background:'#1B2A3B',color:'#00C896',border:'1px solid #00C89640',borderRadius:6,fontSize:14,cursor:'pointer',fontWeight:700,height:34,alignSelf:'end'}}>+</button>
        </div>

        {p.points.length>0&&(
          <>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,marginBottom:14}}>
              <thead><tr style={{background:'#F8F9FB'}}>
                {['#','Nominal','Patrón','Error','Estado'].map(h=><th key={h} style={{padding:'6px 8px',fontSize:10,fontWeight:600,color:'#5A6B7E',textTransform:'uppercase',textAlign:'center'}}>{h}</th>)}
                <th/>
              </tr></thead>
              <tbody>{p.points.map((pt,i)=>{
                const ok=Math.abs(pt.error)<=cfg.tol*3;
                return(
                  <tr key={pt.id} style={{borderTop:'1px solid #F0F0F0'}}>
                    <td style={{padding:'6px 8px',textAlign:'center',color:'#aaa',fontFamily:'Space Mono,monospace',fontSize:12}}>{i+1}</td>
                    <td style={{padding:'6px 8px',textAlign:'center',fontFamily:'Space Mono,monospace',fontSize:12}}>{pt.nominal} {cfg.unit}</td>
                    <td style={{padding:'6px 8px',textAlign:'center',fontFamily:'Space Mono,monospace',fontSize:12,fontWeight:700}}>{pt.reference} {cfg.unit}</td>
                    <td style={{padding:'6px 8px',textAlign:'center',fontFamily:'Space Mono,monospace',fontSize:12,fontWeight:600,color:errClr(pt.error/cfg.tol*3)}}>{fmt(pt.error,cfg.step?3:2)} {cfg.unit}</td>
                    <td style={{padding:'6px 8px',textAlign:'center'}}><span style={{fontFamily:'Space Mono,monospace',fontSize:10,padding:'2px 7px',borderRadius:3,background:ok?'rgba(0,200,150,0.1)':'rgba(230,57,70,0.1)',color:ok?'#00C896':'#E63946'}}>{ok?'OK':'FALLA'}</span></td>
                    <td style={{padding:'6px 8px',textAlign:'center'}}><button onClick={()=>removePoint(pt.id)} style={{background:'none',border:'none',cursor:'pointer',color:'#ccc',fontSize:18}}>×</button></td>
                  </tr>
                );
              })}</tbody>
            </table>

            {/* Summary */}
            <div style={{background:'#F8F9FB',borderRadius:6,padding:12,marginBottom:12}}>
              <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
                {[
                  {l:'Error medio',v:meanError!==null?fmt(meanError,3)+' '+cfg.unit:'—'},
                  {l:cfg.tipo==='gain'?'Factor de ganancia':'Corrección a aplicar',v:correction!==null?(cfg.tipo==='gain'?correction.toFixed(4):fmt(correction,3)+' '+cfg.unit):'—'},
                  {l:'Error máximo',v:maxError!==null?Math.abs(maxError).toFixed(3)+' '+cfg.unit:'—'},
                ].map(x=>(
                  <div key={x.l}>
                    <div style={{fontSize:10,color:'#aaa',textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:2}}>{x.l}</div>
                    <div style={{fontFamily:'Space Mono,monospace',fontSize:16,fontWeight:700,color:'#1A2535'}}>{x.v}</div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <button onClick={applyCorrection} style={{padding:'8px 16px',background:'#00C896',color:'white',border:'none',borderRadius:6,fontSize:13,cursor:'pointer',fontWeight:600}}>
                ✓ Aplicar corrección
              </button>
              {p.applied&&(
                <button onClick={toggleApply} style={{padding:'8px 16px',background:'rgba(245,166,35,0.15)',color:'#F5A623',border:'1px solid #F5A623',borderRadius:6,fontSize:13,cursor:'pointer'}}>
                  {p.applied?'Desactivar':'Activar'}
                </button>
              )}
              <button onClick={clearCorrection} style={{padding:'8px 16px',background:'white',color:'#5A6B7E',border:'1px solid #E2E8F0',borderRadius:6,fontSize:13,cursor:'pointer'}}>
                ↺ Limpiar
              </button>
            </div>
          </>
        )}

        {p.points.length===0&&(
          <div style={{textAlign:'center',padding:'20px 0',color:'#aaa',fontSize:13}}>
            Ingresá al menos 3 puntos de calibración para aplicar corrección.
          </div>
        )}
      </div>

      {/* Applied correction status */}
      {p.applied&&(
        <div style={{background:'rgba(0,200,150,0.06)',border:'1px solid rgba(0,200,150,0.25)',borderRadius:8,padding:12,marginBottom:14,display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:20}}>✅</span>
          <div>
            <div style={{fontWeight:600,color:'#00C896',fontSize:13}}>Corrección activa — {cfg.label}</div>
            <div style={{fontSize:11,color:'#5A6B7E',marginTop:2}}>
              {cfg.tipo==='gain'?`Ganancia: ×${p.gain.toFixed(4)}`:`Offset: ${fmt(p.offset,3)} ${cfg.unit}`}
              {p.date&&` · Calibrado: ${p.date}`}
            </div>
          </div>
        </div>
      )}

      {/* Calibration record */}
      <div style={{background:'white',border:'1px solid #E2E8F0',borderRadius:8,padding:14,marginBottom:14}}>
        <div style={{...SEC,marginBottom:10}}>Datos del registro</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
          <div><label style={LBL}>Técnico</label><input value={p.tecnico||''} onChange={ev=>setMeta('tecnico',ev.target.value)} style={{...INP,fontFamily:'Inter,sans-serif'}}/></div>
          <div><label style={LBL}>Fecha de calibración</label><input type="date" value={p.date||''} onChange={ev=>setMeta('date',ev.target.value)} style={{...INP,fontFamily:'Inter,sans-serif'}}/></div>
          <div><label style={LBL}>Próxima calibración</label><input type="date" value={p.nextDate||''} onChange={ev=>setMeta('nextDate',ev.target.value)} style={{...INP,fontFamily:'Inter,sans-serif'}}/></div>
        </div>
      </div>

      {/* Certificate button */}
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:4}}>
        <button onClick={()=>window.print()} className="no-print" style={{padding:'8px 18px',background:'#1B2A3B',color:'white',border:'none',borderRadius:6,fontSize:13,cursor:'pointer'}}>
          🖨 Certificado de calibración
        </button>
      </div>

      {/* Printable certificate */}
      <div id="cert-area" style={{background:'white',border:'1px solid #E2E8F0',borderRadius:8,padding:24}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:16}}>
          <div>
            <div style={{fontFamily:'Space Mono,monospace',fontSize:9,letterSpacing:'0.15em',color:'#aaa',textTransform:'uppercase'}}>Soluciones Electromédicas SJ — SEM</div>
            <div style={{fontSize:20,fontWeight:700,color:'#1A2535',marginTop:4}}>Certificado de Calibración</div>
            <div style={{fontSize:12,color:'#5A6B7E'}}>Simulador de Paciente SEM v3.0</div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontFamily:'Space Mono,monospace',fontSize:11,fontWeight:700}}>{new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'})}</div>
            <div style={{fontFamily:'Space Mono,monospace',fontSize:10,color:'#aaa',marginTop:2}}>CAL-{new Date().getFullYear()}-{String(new Date().getMonth()+1).padStart(2,'0')}</div>
          </div>
        </div>
        <div style={{height:1,background:'#E2E8F0',margin:'12px 0'}}/>

        {/* Summary table all params */}
        <div style={{fontSize:12,fontWeight:600,color:'#1A2535',marginBottom:8}}>Resumen de calibración — todos los parámetros</div>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:11,marginBottom:16}}>
          <thead><tr style={{background:'#F8F9FB'}}>
            {['Parámetro','Instrumento patrón','N° Cert.','Trazabilidad','Corrección','Estado','Válido hasta'].map(h=>(
              <th key={h} style={{padding:'6px 8px',fontSize:9,fontWeight:600,color:'#5A6B7E',textTransform:'uppercase',textAlign:'left',borderBottom:'2px solid #E2E8F0'}}>{h}</th>
            ))}
          </tr></thead>
          <tbody>{Object.entries(PARAM_CFG).map(([id,c])=>{
            const cp=cal[id];
            const corr=c.tipo==='gain'?`×${cp.gain.toFixed(4)}`:`${fmt(cp.offset,3)} ${c.unit}`;
            return(
              <tr key={id} style={{borderBottom:'1px solid #F0F0F0'}}>
                <td style={{padding:'7px 8px',fontWeight:500}}>{c.label}</td>
                <td style={{padding:'7px 8px',fontFamily:'Space Mono,monospace',fontSize:10}}>{cp.instrument.marca||'—'} {cp.instrument.modelo||''}</td>
                <td style={{padding:'7px 8px',fontFamily:'Space Mono,monospace',fontSize:10}}>{cp.instrument.cert||'—'}</td>
                <td style={{padding:'7px 8px',fontSize:10}}>{cp.instrument.trazabilidad||'—'}</td>
                <td style={{padding:'7px 8px',fontFamily:'Space Mono,monospace',fontSize:10,fontWeight:600,color:cp.applied?'#1A2535':'#aaa'}}>{cp.applied?corr:'Sin calibrar'}</td>
                <td style={{padding:'7px 8px'}}>
                  <span style={{fontFamily:'Space Mono,monospace',fontSize:9,padding:'2px 7px',borderRadius:3,background:cp.applied?'rgba(0,200,150,0.1)':'rgba(200,200,200,0.2)',color:cp.applied?'#00C896':'#aaa'}}>{cp.applied?'CALIBRADO':'PENDIENTE'}</span>
                </td>
                <td style={{padding:'7px 8px',fontFamily:'Space Mono,monospace',fontSize:10}}>{cp.nextDate||'—'}</td>
              </tr>
            );
          })}</tbody>
        </table>

        {/* Points for current param */}
        {p.points.length>0&&(
          <>
            <div style={{height:1,background:'#E2E8F0',margin:'12px 0'}}/>
            <div style={{fontSize:12,fontWeight:600,color:'#1A2535',marginBottom:8}}>Puntos de calibración — {cfg.label}</div>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:11,marginBottom:12}}>
              <thead><tr style={{background:'#F8F9FB'}}>
                {['#','Nominal','Patrón','Error','Estado'].map(h=><th key={h} style={{padding:'5px 8px',fontSize:9,fontWeight:600,color:'#5A6B7E',textTransform:'uppercase',textAlign:'center'}}>{h}</th>)}
              </tr></thead>
              <tbody>{p.points.map((pt,i)=>{
                const ok=Math.abs(pt.error)<=cfg.tol*3;
                return(<tr key={pt.id} style={{borderBottom:'1px solid #F0F0F0'}}>
                  <td style={{padding:'5px 8px',textAlign:'center',color:'#aaa',fontFamily:'Space Mono,monospace',fontSize:11}}>{i+1}</td>
                  <td style={{padding:'5px 8px',textAlign:'center',fontFamily:'Space Mono,monospace',fontSize:11}}>{pt.nominal} {cfg.unit}</td>
                  <td style={{padding:'5px 8px',textAlign:'center',fontFamily:'Space Mono,monospace',fontSize:11,fontWeight:700}}>{pt.reference} {cfg.unit}</td>
                  <td style={{padding:'5px 8px',textAlign:'center',fontFamily:'Space Mono,monospace',fontSize:11,color:ok?'#00C896':'#E63946'}}>{fmt(pt.error,3)} {cfg.unit}</td>
                  <td style={{padding:'5px 8px',textAlign:'center'}}><span style={{fontFamily:'Space Mono,monospace',fontSize:9,padding:'2px 6px',borderRadius:3,background:ok?'rgba(0,200,150,0.1)':'rgba(230,57,70,0.1)',color:ok?'#00C896':'#E63946'}}>{ok?'OK':'FALLA'}</span></td>
                </tr>);
              })}</tbody>
            </table>
            <div style={{fontSize:11,color:'#5A6B7E',marginBottom:12}}>Norma de referencia: {cfg.norma} · Técnico: {p.tecnico||'—'} · Corrección aplicada: {cfg.tipo==='gain'?`Ganancia ×${p.gain.toFixed(4)}`:`Offset ${fmt(p.offset,3)} ${cfg.unit}`}</div>
          </>
        )}

        <div style={{height:1,background:'#E2E8F0',margin:'16px 0'}}/>
        <div style={{fontSize:11,color:'#aaa',lineHeight:1.7,marginBottom:24}}>
          La calibración fue realizada por comparación directa con instrumento patrón de referencia trazable. Las correcciones se aplican automáticamente al Simulador de Paciente SEM v3.0 hasta la fecha de próxima calibración indicada.
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:30,marginTop:40}}>
          {['Técnico responsable','Instrumento patrón / Lab. calibración','Autorizado por'].map(l=>(
            <div key={l} style={{borderTop:'1px solid #ccc',paddingTop:8,fontSize:11,color:'#aaa'}}>{l}</div>
          ))}
        </div>
      </div>
    </div>
  );
}

// APP
// ══════════════════════════════════════════════════════
function App(){
  const [tab,setTab]=useState('sim');
  const [rhythm,setRhythm]=useState('sinusal');
  const [running,setRunning]=useState(true);
  const [prog,setProg]=useState('normal');
  const [eq,setEq]=useState({marca:'',modelo:'',serie:'',cliente:'',tecnico:'',ot:''});
  const [vitals,setVitals]=useState({hr:72,spo2:98,sys:120,dia:80,temp:36.6,resp:16});
  const [ecgMode,setEcgMode]=useState('cardiaco');
  const [amplitude,setAmplitude]=useState(1.0);
  const [stOffset,setStOffset]=useState(0.0);
  const [spo2Brand,setSpo2Brand]=useState('nellcor');
  const [cal,setCal]=useState(()=>{ try{ return JSON.parse(localStorage.getItem('sem_cal'))||defaultCal; }catch{ return defaultCal; } });

  useEffect(()=>{ localStorage.setItem('sem_cal',JSON.stringify(cal)); },[cal]);

  const setV=(k,v)=>{setVitals(prev=>({...prev,[k]:v}));setProg(null);};
  const applyProg=p=>{setVitals({hr:p.hr,spo2:p.spo2,sys:p.sys,dia:p.dia,temp:p.temp,resp:p.resp});setRhythm(p.rhythm);setProg(p.id);};

  // Apply calibration corrections to output values
  const correctedVitals = {
    ...vitals,
    sys:  Math.round(vitals.sys  + (cal.nibp.applied ? cal.nibp.offset : 0)),
    dia:  Math.round(vitals.dia  + (cal.nibp.applied ? cal.nibp.offset : 0)),
    temp: parseFloat((vitals.temp + (cal.temp.applied ? cal.temp.offset : 0)).toFixed(1)),
    spo2: Math.round(vitals.spo2 + (cal.spo2.applied ? cal.spo2.offset : 0)),
  };
  const correctedAmplitude = amplitude * (cal.ecg.applied ? cal.ecg.gain : 1);

  const map=Math.round(correctedVitals.dia+(correctedVitals.sys-correctedVitals.dia)/3);
  const dead=rhythm==='vfib'||rhythm==='asistolia';
  const hrAlarm=dead||vitals.hr<50||vitals.hr>120;
  const spo2Alarm=dead||correctedVitals.spo2<90;
  const bpAlarm=dead||correctedVitals.sys>=180||correctedVitals.sys<90;
  const tempAlarm=correctedVitals.temp>=38.5||correctedVitals.temp<35.5;
  const anyCal=cal.nibp.applied||cal.temp.applied||cal.ecg.applied||cal.spo2.applied;

  const hrC=dead?'#E63946':vitals.hr<50?'#3A86FF':vitals.hr>120?'#F5A623':'#00C896';
  const spC=correctedVitals.spo2<90?'#E63946':correctedVitals.spo2<95?'#F5A623':'#00BFFF';
  const nibpC=dead?'#E63946':correctedVitals.sys>=180?'#E63946':correctedVitals.sys>=140?'#F5A623':correctedVitals.sys<90?'#3A86FF':'#00C896';
  const tmpC=correctedVitals.temp>=38.5?'#E63946':correctedVitals.temp>=37.5?'#F5A623':correctedVitals.temp<35.5?'#3A86FF':'#00C896';
  const ri=RHYTHM_INFO[rhythm]||RHYTHM_INFO.sinusal;

  const SL=({label,k,min,max,step,unit})=>(
    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:9}}>
      <span style={{fontFamily:'Space Mono,monospace',fontSize:10,color:'#5A6B7E',width:36,flexShrink:0}}>{label}</span>
      <input type="range" min={min} max={max} step={step} value={vitals[k]}
        onChange={ev=>setV(k,step<1?parseFloat(ev.target.value):Number(ev.target.value))}
        style={{flex:1,accentColor:'#00C896'}}/>
      <span style={{fontFamily:'Space Mono,monospace',fontSize:13,fontWeight:700,color:'#1A2535',width:60,textAlign:'right',flexShrink:0}}>
        {step<1?Number(vitals[k]).toFixed(1):vitals[k]} <span style={{fontSize:9,fontWeight:400,color:'#aaa'}}>{unit}</span>
      </span>
    </div>
  );

  const brand=SPO2_BRANDS[spo2Brand];
  const TABS=[['sim','Simulador'],['cal','Calibración'],['verif','Verificación'],['informe','Informe']];

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh'}}>
      <div id="app-header" style={{background:'#0B1520',padding:'8px 16px',display:'flex',alignItems:'center',gap:12,flexShrink:0,borderBottom:'1px solid #1A2535'}}>
        <span style={{fontFamily:'Space Mono,monospace',fontSize:12,fontWeight:700,color:'#00C896',letterSpacing:'0.1em'}}>◉ SEM</span>
        <span style={{fontSize:13,color:'rgba(255,255,255,0.65)',fontWeight:500}}>Simulator</span>
        {anyCal&&<span style={{fontFamily:'Space Mono,monospace',fontSize:9,color:'#00C896',border:'1px solid #00C89640',padding:'2px 8px',borderRadius:3,background:'rgba(0,200,150,0.08)'}}>✓ CALIBRADO</span>}
        {ecgMode!=='cardiaco'&&<span style={{fontFamily:'Space Mono,monospace',fontSize:9,color:'#F5A623',border:'1px solid #F5A62344',padding:'2px 8px',borderRadius:3}}>CAL {ecgMode.toUpperCase()}</span>}
        <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontFamily:'Space Mono,monospace',fontSize:9,color:'rgba(255,255,255,0.18)'}}>v3.0</span>
          <button onClick={()=>setRunning(!running)} style={{padding:'4px 14px',fontSize:11,fontFamily:'Space Mono,monospace',fontWeight:700,background:running?'rgba(230,57,70,0.15)':'rgba(0,200,150,0.15)',color:running?'#E63946':'#00C896',border:`1px solid ${running?'#E63946':'#00C896'}`,borderRadius:4,cursor:'pointer'}}>
            {running?'⏸ PAUSAR':'▶ INICIAR'}
          </button>
        </div>
      </div>

      <div style={{flex:1,display:'flex',overflow:'hidden'}}>
        {/* MONITOR */}
        <div id="monitor-panel" style={{width:355,minWidth:300,background:'#07090F',display:'flex',flexDirection:'column',padding:12,gap:10,borderRight:'1px solid #141E2A',flexShrink:0,overflow:'hidden'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{fontFamily:'Space Mono,monospace',fontSize:8,letterSpacing:'0.14em',color:'rgba(0,200,150,0.35)',textTransform:'uppercase'}}>
              {ecgMode==='cardiaco'?'Lead II':'Cal Signal'}
              {anyCal&&<span style={{marginLeft:6,color:'#F5A623',fontSize:7}}>CAL</span>}
            </div>
            <div style={{fontFamily:'Space Mono,monospace',fontSize:9,color:ri.color,border:`1px solid ${ri.color}40`,padding:'2px 8px',borderRadius:3,background:`${ri.color}12`,animation:dead?'blink 0.8s step-end infinite':'none'}}>
              {ecgMode!=='cardiaco'?`${ecgMode.toUpperCase()} ${correctedAmplitude.toFixed(2)}mV`:ri.label}
            </div>
          </div>

          <WaveCanvas vitals={correctedVitals} rhythm={rhythm} running={running} type="ecg" ecgMode={ecgMode} amplitude={correctedAmplitude} stOffset={stOffset}/>

          <div>
            <div style={{fontFamily:'Space Mono,monospace',fontSize:8,letterSpacing:'0.12em',color:'rgba(0,191,255,0.35)',marginBottom:3}}>PLETH — SpO₂</div>
            <WaveCanvas vitals={correctedVitals} rhythm={rhythm} running={running} type="pleth" ecgMode={ecgMode} amplitude={correctedAmplitude} stOffset={stOffset}/>
          </div>

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6}}>
            <Readout label="FC" value={dead?'---':vitals.hr} unit="bpm" color={hrC} alarm={hrAlarm} calActive={false}/>
            <Readout label="SpO₂" value={dead?'---':correctedVitals.spo2} unit="%" color={spC} alarm={spo2Alarm} calActive={cal.spo2.applied}/>
            <Readout label="RESP" value={dead?'---':vitals.resp} unit="rpm" color="#00C896"/>
          </div>

          <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:6}}>
            <div style={{background:'rgba(0,0,0,0.45)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:6,padding:'8px 10px',position:'relative'}}>
              {cal.nibp.applied&&<span style={{position:'absolute',top:4,right:6,fontFamily:'Space Mono,monospace',fontSize:7,color:'#F5A623'}}>CAL</span>}
              <div style={{fontFamily:'Space Mono,monospace',fontSize:24,fontWeight:700,color:nibpC,textShadow:`0 0 12px ${nibpC}70`,letterSpacing:-1,lineHeight:1}}>
                {dead?'---':`${correctedVitals.sys}/${correctedVitals.dia}`}
              </div>
              <div style={{fontFamily:'Space Mono,monospace',fontSize:8,color:'rgba(255,255,255,0.22)',marginTop:3}}>NIBP mmHg · MAP {dead?'---':map}</div>
            </div>
            <div style={{background:'rgba(0,0,0,0.45)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:6,padding:'8px 6px',textAlign:'center',position:'relative'}}>
              {cal.temp.applied&&<span style={{position:'absolute',top:3,right:4,fontFamily:'Space Mono,monospace',fontSize:7,color:'#F5A623'}}>CAL</span>}
              <div style={{fontFamily:'Space Mono,monospace',fontSize:22,fontWeight:700,color:tmpC,textShadow:`0 0 10px ${tmpC}70`,lineHeight:1}}>{Number(correctedVitals.temp).toFixed(1)}</div>
              <div style={{fontFamily:'Space Mono,monospace',fontSize:8,color:`${tmpC}70`,letterSpacing:'0.08em',marginTop:3}}>TEMP</div>
              <div style={{fontFamily:'Space Mono,monospace',fontSize:8,color:'rgba(255,255,255,0.18)',marginTop:1}}>°C</div>
            </div>
          </div>

          {stOffset!==0&&ecgMode==='cardiaco'&&(
            <div style={{fontFamily:'Space Mono,monospace',fontSize:9,padding:'4px 10px',borderRadius:3,color:stOffset>0?'#F5A623':'#3A86FF',border:`1px solid ${stOffset>0?'#F5A62344':'#3A86FF44'}`,textAlign:'center'}}>
              ST {stOffset>0?'+':''}{stOffset.toFixed(2)} mV {stOffset>0?'↑ elevación':'↓ depresión'}
            </div>
          )}

          {(hrAlarm||spo2Alarm||bpAlarm||tempAlarm)&&(
            <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
              {dead&&<span style={{fontFamily:'Space Mono,monospace',fontSize:9,padding:'3px 8px',borderRadius:3,color:'#E63946',border:'1px solid #E63946',background:'rgba(230,57,70,0.1)',animation:'blink 0.7s step-end infinite'}}>⚠ {rhythm==='vfib'?'FIBRILACIÓN V.':'ASISTOLIA'}</span>}
              {hrAlarm&&!dead&&<span style={{fontFamily:'Space Mono,monospace',fontSize:9,padding:'3px 8px',borderRadius:3,color:vitals.hr<50?'#3A86FF':'#F5A623',border:`1px solid ${vitals.hr<50?'#3A86FF':'#F5A623'}`}}>{vitals.hr<50?'BRADICARDIA':'TAQUICARDIA'}</span>}
              {spo2Alarm&&!dead&&<span style={{fontFamily:'Space Mono,monospace',fontSize:9,padding:'3px 8px',borderRadius:3,color:'#E63946',border:'1px solid #E63946'}}>SpO₂ BAJA</span>}
              {bpAlarm&&!dead&&<span style={{fontFamily:'Space Mono,monospace',fontSize:9,padding:'3px 8px',borderRadius:3,color:correctedVitals.sys>=180?'#E63946':'#3A86FF',border:`1px solid ${correctedVitals.sys>=180?'#E63946':'#3A86FF'}`}}>{correctedVitals.sys>=180?'HTA SEVERA':'HIPOTENSIÓN'}</span>}
              {tempAlarm&&<span style={{fontFamily:'Space Mono,monospace',fontSize:9,padding:'3px 8px',borderRadius:3,color:'#F5A623',border:'1px solid #F5A623'}}>{correctedVitals.temp>=38.5?'FIEBRE':'HIPOTERMIA'}</span>}
            </div>
          )}

          <div style={{marginTop:'auto'}}>
            <WiFiPanel vitals={correctedVitals} rhythm={rhythm} ecgMode={ecgMode} amplitude={correctedAmplitude} stOffset={stOffset}/>
          </div>
        </div>

        {/* CONTROLS */}
        <div id="controls-panel" style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',background:'#F2F4F7'}}>
          <div id="tab-bar" style={{display:'flex',borderBottom:'1px solid #E2E8F0',background:'white',padding:'0 16px',flexShrink:0,overflowX:'auto'}}>
            {TABS.map(([id,lbl])=>(
              <button key={id} onClick={()=>setTab(id)} style={{padding:'11px 14px',fontSize:13,fontWeight:500,background:'none',border:'none',borderBottom:tab===id?'2px solid #00C896':'2px solid transparent',color:tab===id?'#00C896':'#5A6B7E',cursor:'pointer',marginBottom:-1,whiteSpace:'nowrap',display:'flex',alignItems:'center',gap:4}}>
                {lbl}
                {id==='cal'&&anyCal&&<span style={{width:7,height:7,borderRadius:'50%',background:'#00C896',display:'inline-block'}}/>}
              </button>
            ))}
          </div>

          <div style={{flex:1,overflow:'auto',padding:16}}>
            {tab==='sim'&&(
              <div>
                <div style={{marginBottom:18}}>
                  <div style={{...SEC,marginBottom:8}}>Programas clínicos</div>
                  <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                    {PROGRAMS.map(p=>(<button key={p.id} onClick={()=>applyProg(p)} style={{padding:'5px 11px',fontSize:11,fontWeight:500,borderRadius:100,cursor:'pointer',border:prog===p.id?'none':'1px solid #E2E8F0',background:prog===p.id?p.color:'white',color:prog===p.id?'white':'#5A6B7E'}}>{p.label}</button>))}
                  </div>
                </div>

                <div style={{marginBottom:18}}>
                  <div style={{...SEC,marginBottom:8}}>Ritmo ECG</div>
                  <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                    {Object.entries(RHYTHM_INFO).map(([id,info])=>{
                      const sel=rhythm===id;
                      const bg=sel?(id==='sinusal'?'#1B2A3B':id==='marcap'?'#9B59B6':['vfib','asistolia'].includes(id)?'#E63946':'#F5A623'):'white';
                      return <button key={id} onClick={()=>{setRhythm(id);setProg(null);}} style={{padding:'5px 11px',fontSize:11,fontWeight:500,borderRadius:100,cursor:'pointer',border:sel?'none':'1px solid #E2E8F0',background:bg,color:sel?'white':'#5A6B7E'}}>{info.label}</button>;
                    })}
                  </div>
                </div>

                <div style={{marginBottom:18,background:'white',border:'1px solid #E2E8F0',borderRadius:8,padding:14}}>
                  <div style={{...SEC,marginBottom:12}}>🔧 Señales de calibración ECG</div>
                  <div style={{marginBottom:12}}>
                    <div style={{fontSize:11,color:'#5A6B7E',fontWeight:500,marginBottom:6}}>Tipo de señal</div>
                    <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                      {[['cardiaco','❤ Cardíaco','#00C896'],['cuadrada','⬜ Cuadrada','#F5A623'],['senoidal','〜 Senoidal','#3A86FF'],['triangular','△ Triangular','#9B59B6']].map(([id,lbl,col])=>(
                        <button key={id} onClick={()=>setEcgMode(id)} style={{padding:'6px 14px',fontSize:12,fontWeight:500,borderRadius:6,cursor:'pointer',border:ecgMode===id?'none':'1px solid #E2E8F0',background:ecgMode===id?col:'white',color:ecgMode===id?'white':'#5A6B7E'}}>{lbl}</button>
                      ))}
                    </div>
                  </div>
                  <div style={{marginBottom:12}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
                      <span style={{fontSize:11,color:'#5A6B7E',fontWeight:500}}>Amplitud</span>
                      <span style={{fontFamily:'Space Mono,monospace',fontSize:14,fontWeight:700}}>
                        {amplitude.toFixed(2)} <span style={{fontSize:10,color:'#aaa'}}>mV</span>
                        {cal.ecg.applied&&<span style={{fontSize:9,color:'#F5A623',marginLeft:6}}>→ {correctedAmplitude.toFixed(2)} mV (cal)</span>}
                      </span>
                    </div>
                    <input type="range" min={0.1} max={2.0} step={0.05} value={amplitude} onChange={ev=>setAmplitude(parseFloat(ev.target.value))} style={{width:'100%',accentColor:'#00C896'}}/>
                    <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'#aaa',marginTop:3}}><span>0.1</span><span style={{color:'#00C896',fontWeight:600}}>1.0 mV std</span><span>2.0</span></div>
                  </div>
                  {ecgMode==='cardiaco'&&(
                    <div>
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
                        <span style={{fontSize:11,color:'#5A6B7E',fontWeight:500}}>Segmento ST</span>
                        <span style={{fontFamily:'Space Mono,monospace',fontSize:14,fontWeight:700,color:stOffset>0?'#F5A623':stOffset<0?'#3A86FF':'#00C896'}}>{stOffset>0?'+':''}{stOffset.toFixed(2)} <span style={{fontSize:10,color:'#aaa'}}>mV</span></span>
                      </div>
                      <input type="range" min={-0.5} max={0.5} step={0.05} value={stOffset} onChange={ev=>setStOffset(parseFloat(ev.target.value))} style={{width:'100%',accentColor:stOffset>0?'#F5A623':stOffset<0?'#3A86FF':'#64748b'}}/>
                      <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'#aaa',marginTop:3}}>
                        <span style={{color:'#3A86FF'}}>-0.5 depresión</span><span>0 normal</span><span style={{color:'#F5A623'}}>+0.5 elevación</span>
                      </div>
                      {stOffset!==0&&<div style={{marginTop:8,padding:'5px 10px',borderRadius:5,background:stOffset>0?'rgba(245,166,35,0.08)':'rgba(58,134,255,0.08)',border:`1px solid ${stOffset>0?'rgba(245,166,35,0.3)':'rgba(58,134,255,0.3)'}`,fontSize:11,color:stOffset>0?'#F5A623':'#3A86FF'}}>
                        {stOffset>0?`ST +${stOffset.toFixed(2)} mV — isquemia / infarto`:`ST ${stOffset.toFixed(2)} mV — isquemia subendocárdica`}
                      </div>}
                      <button onClick={()=>setStOffset(0)} style={{marginTop:6,padding:'3px 10px',fontSize:11,background:'none',border:'1px solid #E2E8F0',borderRadius:4,cursor:'pointer',color:'#5A6B7E'}}>↺ Reset ST</button>
                    </div>
                  )}
                </div>

                <div style={{marginBottom:18,background:'white',border:'1px solid #E2E8F0',borderRadius:8,padding:14}}>
                  <div style={{...SEC,marginBottom:12}}>💡 Saturómetro — Marca</div>
                  <div style={{display:'flex',gap:6,marginBottom:12}}>
                    {Object.entries(SPO2_BRANDS).map(([id,b])=>(<button key={id} onClick={()=>setSpo2Brand(id)} style={{flex:1,padding:'7px 8px',fontSize:11,fontWeight:500,borderRadius:6,cursor:'pointer',border:spo2Brand===id?'none':'1px solid #E2E8F0',background:spo2Brand===id?b.color:'white',color:spo2Brand===id?'white':'#5A6B7E'}}>{b.label}</button>))}
                  </div>
                  <div style={{background:'#F8F9FB',borderRadius:6,padding:10,fontSize:11,lineHeight:1.8}}>
                    <div style={{display:'grid',gridTemplateColumns:'auto 1fr',gap:'2px 12px'}}>
                      <span style={{color:'#5A6B7E',fontWeight:500}}>Conector:</span><span>{brand.connector}</span>
                      <span style={{color:'#5A6B7E',fontWeight:500}}>Detección:</span><span>{brand.detect}</span>
                      <span style={{color:'#5A6B7E',fontWeight:500}}>Notas:</span><span>{brand.notes}</span>
                    </div>
                    <div style={{marginTop:8,padding:'5px 10px',borderRadius:5,background:`${brand.color}11`,border:`1px solid ${brand.color}33`,color:brand.color,fontSize:10,fontFamily:'Space Mono,monospace'}}>🔧 HW: {brand.hw}</div>
                  </div>
                </div>

                <div style={{marginBottom:18}}>
                  <div style={{...SEC,marginBottom:8}}>Parámetros</div>
                  <SL label="FC" k="hr" min={20} max={200} step={1} unit="bpm"/>
                  <SL label="SpO₂" k="spo2" min={50} max={100} step={1} unit="%"/>
                  <SL label="SYS" k="sys" min={60} max={260} step={1} unit="mmHg"/>
                  <SL label="DIA" k="dia" min={30} max={160} step={1} unit="mmHg"/>
                  <SL label="TEMP" k="temp" min={32.0} max={42.0} step={0.1} unit="°C"/>
                  <SL label="RESP" k="resp" min={4} max={60} step={1} unit="rpm"/>
                </div>
              </div>
            )}
            {tab==='cal'&&<CalibrationTab cal={cal} setCal={setCal}/>}
            {tab==='verif'&&<VerifTab vitals={{hr:correctedVitals.hr,spo2:correctedVitals.spo2,sys:correctedVitals.sys,dia:correctedVitals.dia,temp:correctedVitals.temp}}/>}
            {tab==='informe'&&<InformeTab eq={eq} setEq={setEq}/>}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); });
}
</script>
</body>
</html>
