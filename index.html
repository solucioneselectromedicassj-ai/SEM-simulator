// ══════════════════════════════════════════════════════
// ECG MATH
// ══════════════════════════════════════════════════════
function gauss(x,c,w,a){return a*Math.exp(-Math.pow((x-c)/w,2));}
function ecgSinusal(p){return gauss(p,.080,.024,.14)+gauss(p,.192,.007,-.12)+gauss(p,.208,.011,1)+gauss(p,.226,.007,-.28)+gauss(p,.420,.068,.27);}
function ecgAfib(p){const f=.030*Math.sin(p*Math.PI*14)+.018*Math.sin(p*Math.PI*23+.9)+.012*Math.sin(p*Math.PI*34+2);return f+gauss(p,.192,.007,-.12)+gauss(p,.208,.011,1)+gauss(p,.226,.007,-.28)+gauss(p,.420,.062,.22);}
function ecgFlutter(p){return .15*Math.sin(p*Math.PI*4-.5)+.08*Math.sin(p*Math.PI*8)+gauss(p,.208,.011,.9)+gauss(p,.226,.007,-.25)+gauss(p,.420,.06,.2);}
function ecgVtach(p){return gauss(p,.18,.025,-.22)+gauss(p,.26,.028,.88)+gauss(p,.34,.022,-.48)+gauss(p,.52,.09,-.2);}
function ecgMarcap(p){return (p>=.17&&p<.178?2:0)+gauss(p,.22,.022,.72)+gauss(p,.30,.018,-.38)+gauss(p,.50,.08,-.18);}
function calSignal(ph,mode,amp){
  if(mode==='cuadrada') return ph<.5?amp:0;
  if(mode==='senoidal') return amp*Math.sin(ph*2*Math.PI);
  if(mode==='triangular'){if(ph<.25)return amp*(ph/.25);if(ph<.75)return amp*(1-(ph-.25)/.25);return amp*(-1+(ph-.75)/.25);}
  return 0;
}
function getECG(ph,rhythm,mode,amp,st){
  if(mode!=='cardiaco') return calSignal(ph,mode,amp);
  let b;
  switch(rhythm){
    case 'sinusal':b=ecgSinusal(ph)*amp;break;
    case 'afib':b=ecgAfib(ph)*amp;break;
    case 'flutter':b=ecgFlutter(ph)*amp;break;
    case 'vtach':b=ecgVtach(ph)*amp;break;
    case 'vfib':return(Math.random()-.5)*1.4*amp;
    case 'asistolia':return 0;
    case 'marcap':b=ecgMarcap(ph)*amp;break;
    default:b=ecgSinusal(ph)*amp;
  }
  if(st!==0&&rhythm!=='vfib'&&rhythm!=='asistolia'&&ph>.235&&ph<.385)
    b+=st*Math.min(1,Math.min((ph-.235)/.025,(.385-ph)/.025));
  return b;
}
function getPleth(p,rhythm,spo2){
  if(rhythm==='vfib'||rhythm==='asistolia')return 0;
  let v=p<.28?Math.pow(Math.sin((p/.28)*Math.PI/2),2):Math.pow(Math.cos(((p-.28)/.72)*Math.PI/2),1.5)*.38;
  return v*(spo2/100);
}

// ══════════════════════════════════════════════════════
// CANVAS
// ══════════════════════════════════════════════════════
function drawWave(canvas,buf,color,label,yMin,yMax){
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height,pL=4,pR=4,pT=4,pB=12;
  const pH=H-pT-pB,pW=W-pL-pR;
  ctx.fillStyle='#07090F';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;
  for(let i=1;i<4;i++){const y=pT+(i/4)*pH;ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(W-pR,y);ctx.stroke();}
  for(let i=1;i<8;i++){const x=pL+(i/8)*pW;ctx.beginPath();ctx.moveTo(x,pT);ctx.lineTo(x,pT+pH);ctx.stroke();}
  ctx.fillStyle=color+'66';ctx.font='8px Space Mono,monospace';ctx.textAlign='left';ctx.fillText(label,pL+3,H-3);
  if(buf.length<2)return;
  const sy=v=>pT+pH*(1-(v-yMin)/(yMax-yMin));
  ctx.save();ctx.shadowBlur=9;ctx.shadowColor=color;ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineJoin='round';ctx.beginPath();
  buf.forEach((v,i)=>{const x=pL+i,y=Math.max(pT,Math.min(pT+pH,sy(v)));i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.stroke();ctx.restore();
  if(buf.length>0){const hx=pL+buf.length-1,hy=Math.max(pT,Math.min(pT+pH,sy(buf[buf.length-1])));ctx.save();ctx.beginPath();ctx.arc(hx,hy,3,0,Math.PI*2);ctx.fillStyle='#fff';ctx.shadowBlur=10;ctx.shadowColor=color;ctx.fill();ctx.restore();}
}

function WaveCanvas({vitals,rhythm,running,type,ecgMode,amplitude,stOffset,h}){
  const canvasRef=useRef(null),buf=useRef([]),phase=useRef(Math.random()*.3),rr=useRef(1),lastT=useRef(null),raf=useRef(null);
  const p=useRef({vitals,rhythm,running,ecgMode,amplitude,stOffset});
  useEffect(()=>{p.current={vitals,rhythm,running,ecgMode,amplitude,stOffset};},[vitals,rhythm,running,ecgMode,amplitude,stOffset]);
  useEffect(()=>{
    const canvas=canvasRef.current;if(!canvas)return;
    const loop=()=>{
      const{vitals,rhythm,running,ecgMode,amplitude,stOffset}=p.current;
      const now=performance.now();if(!lastT.current)lastT.current=now;
      const dt=Math.min((now-lastT.current)/1000,.05);lastT.current=now;
      const pW=canvas.width-8;
      if(running){
        const ct=60/Math.max(1,vitals.hr||60);
        phase.current+=dt/(rr.current*ct);
        if(phase.current>=1){phase.current-=1;rr.current=rhythm==='afib'?(.6+Math.random()*.8):rhythm==='flutter'?.5:1;}
        buf.current.push(type==='ecg'?getECG(phase.current,rhythm,ecgMode,amplitude,stOffset):getPleth(phase.current,rhythm,vitals.spo2));
      } else buf.current.push(0);
      if(buf.current.length>pW)buf.current.shift();
      if(type==='ecg'){const col=ecgMode!=='cardiaco'?'#F5A623':'#00C896';drawWave(canvas,buf.current,col,ecgMode!=='cardiaco'?`CAL ${ecgMode.toUpperCase()}`:'ECG II',-0.5*amplitude-.1,2.6*amplitude+.3);}
      else{const c=vitals.spo2<90?'#E63946':vitals.spo2<95?'#F5A623':'#00BFFF';drawWave(canvas,buf.current,c,'PLETH',-.05,1.05);}
      raf.current=requestAnimationFrame(loop);
    };
    raf.current=requestAnimationFrame(loop);
    return()=>{cancelAnimationFrame(raf.current);lastT.current=null;};
  },[type]);
  const ch=h||100;
  return<canvas ref={canvasRef} width={540} height={ch} style={{width:'100%',height:ch+'px',display:'block'}}/>;
}

const INP={padding:'8px 10px',border:'1px solid #E2E8F0',borderRadius:6,fontSize:13,fontFamily:'Space Mono,monospace',outline:'none',width:'100%'};

// Slider row
function NumControl({label,value,min,max,step,unit,onChange}){
  const [editing,setEditing]=useState(false);
  const [editVal,setEditVal]=useState('');
  const holdRef=useRef(null);
  const fmt=v=>step<1?Number(v).toFixed(1):String(v);
  const clamp=v=>Math.round(Math.min(max,Math.max(min,v))*(1/step))/(1/step);
  const inc=()=>onChange(clamp(parseFloat(value)+step));
  const dec=()=>onChange(clamp(parseFloat(value)-step));
  const startHold=(fn)=>{fn();holdRef.current=setInterval(fn,120);};
  const stopHold=()=>{clearInterval(holdRef.current);};
  const commit=()=>{const v=parseFloat(editVal);if(!isNaN(v))onChange(clamp(v));setEditing(false);};
  return(
    <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:10}}>
      <span style={{fontFamily:'Space Mono,monospace',fontSize:10,color:'#5A6B7E',width:34,flexShrink:0}}>{label}</span>
      <button
        onMouseDown={()=>startHold(dec)} onMouseUp={stopHold} onMouseLeave={stopHold}
        onTouchStart={e=>{e.preventDefault();startHold(dec);}} onTouchEnd={stopHold}
        style={{width:42,height:42,fontSize:22,fontWeight:300,borderRadius:8,border:'1px solid #E2E8F0',background:'white',cursor:'pointer',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',userSelect:'none'}}>−</button>
      {editing?(
        <input type="number" value={editVal} autoFocus
          onChange={e=>setEditVal(e.target.value)}
          onBlur={commit}
          onKeyDown={e=>e.key==='Enter'&&commit()}
          style={{flex:1,textAlign:'center',fontFamily:'Space Mono,monospace',fontSize:20,fontWeight:700,border:'2px solid #00C896',borderRadius:8,padding:'8px 4px',outline:'none'}}/>
      ):(
        <button onClick={()=>{setEditVal(fmt(value));setEditing(true);}}
          style={{flex:1,textAlign:'center',fontFamily:'Space Mono,monospace',fontSize:20,fontWeight:700,background:'#F8F9FB',border:'1px solid #E2E8F0',borderRadius:8,padding:'9px 4px',cursor:'pointer',lineHeight:1}}>
          {fmt(value)}<span style={{fontSize:10,color:'#aaa',marginLeft:3}}>{unit}</span>
        </button>
      )}
      <button
        onMouseDown={()=>startHold(inc)} onMouseUp={stopHold} onMouseLeave={stopHold}
        onTouchStart={e=>{e.preventDefault();startHold(inc);}} onTouchEnd={stopHold}
        style={{width:42,height:42,fontSize:22,fontWeight:300,borderRadius:8,border:'1px solid #E2E8F0',background:'white',cursor:'pointer',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',userSelect:'none'}}>+</button>
    </div>
  );
}
// Keep SliderRow as alias for NumControl

// ══════════════════════════════════════════════════════
// MONITOR DISPLAY (panel oscuro reutilizable)
// ══════════════════════════════════════════════════════
function MonitorDisplay({cv,rhythm,running,ecgMode,amplitude,stOffset,cal,compact}){
  const dead=rhythm==='vfib'||rhythm==='asistolia';
  const ri=RHYTHM_INFO[rhythm]||RHYTHM_INFO.sinusal;
  const hrC=dead?'#E63946':cv.hr<50?'#3A86FF':cv.hr>120?'#F5A623':'#00C896';
  const spC=cv.spo2<90?'#E63946':cv.spo2<95?'#F5A623':'#00BFFF';
  const nibpC=dead?'#E63946':cv.sys>=180?'#E63946':cv.sys>=140?'#F5A623':cv.sys<90?'#3A86FF':'#00C896';
  const tmpC=cv.temp>=38.5?'#E63946':cv.temp>=37.5?'#F5A623':cv.temp<35.5?'#3A86FF':'#00C896';
  const map=Math.round(cv.dia+(cv.sys-cv.dia)/3);
  return(
    <div style={{background:'#07090F',padding:'10px 12px',display:'flex',flexDirection:'column',gap:8}}>
      {/* Rhythm badge */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{fontFamily:'Space Mono,monospace',fontSize:8,color:'rgba(0,200,150,0.35)',letterSpacing:'0.12em',textTransform:'uppercase'}}>
          {ecgMode!=='cardiaco'?`CAL ${ecgMode.toUpperCase()}`:'Lead II'}
        </span>
        <span style={{fontFamily:'Space Mono,monospace',fontSize:9,color:ri.color,border:`1px solid ${ri.color}40`,padding:'2px 8px',borderRadius:3,animation:dead?'blink 0.8s step-end infinite':'none'}}>
          {ecgMode!=='cardiaco'?`${amplitude.toFixed(2)} mV`:ri.label}
        </span>
      </div>
      {/* ECG */}
      <WaveCanvas vitals={cv} rhythm={rhythm} running={running} type="ecg" ecgMode={ecgMode} amplitude={amplitude} stOffset={stOffset} h={compact?75:100}/>
      {/* PLETH */}
      {!compact&&<>
        <div style={{fontFamily:'Space Mono,monospace',fontSize:8,color:'rgba(0,191,255,0.35)',letterSpacing:'0.1em'}}>PLETH — SpO₂</div>
        <WaveCanvas vitals={cv} rhythm={rhythm} running={running} type="pleth" ecgMode={ecgMode} amplitude={amplitude} stOffset={stOffset} h={60}/>
      </>}
      {/* Readouts */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:5}}>
        <Readout label="FC" value={dead?'---':cv.hr} unit="bpm" color={hrC} alarm={dead||cv.hr<50||cv.hr>120} small/>
        <Readout label="SpO₂" value={dead?'---':cv.spo2} unit="%" color={spC} alarm={dead||cv.spo2<90} small cal={cal?.spo2?.applied}/>
        <Readout label="RESP" value={dead?'---':cv.resp} unit="rpm" color="#00C896" small/>
        <Readout label="TEMP" value={dead?'---':Number(cv.temp).toFixed(1)} unit="°C" color={tmpC} alarm={cv.temp>=38.5||cv.temp<35.5} small cal={cal?.temp?.applied}/>
      </div>
      {/* NIBP */}
      <div style={{background:'rgba(0,0,0,0.5)',border:'1px solid rgba(255,255,255,0.07)',borderRadius:6,padding:'8px 12px',position:'relative'}}>
        {cal?.nibp?.applied&&<span style={{position:'absolute',top:4,right:6,fontFamily:'Space Mono,monospace',fontSize:7,color:'#F5A623'}}>CAL</span>}
        <div style={{fontFamily:'Space Mono,monospace',fontSize:32,fontWeight:700,color:nibpC,textShadow:`0 0 10px ${nibpC}70`,lineHeight:1,letterSpacing:-1}}>
          {dead?'---':`${cv.sys}/${cv.dia}`}
        </div>
        <div style={{fontFamily:'Space Mono,monospace',fontSize:8,color:'rgba(255,255,255,0.22)',marginTop:2}}>
          NIBP mmHg · MAP {dead?'---':map}
          {stOffset!==0&&ecgMode==='cardiaco'&&<span style={{marginLeft:10,color:stOffset>0?'#F5A623':'#3A86FF'}}>· ST {stOffset>0?'+':''}{stOffset.toFixed(2)}mV</span>}
        </div>
      </div>
      {/* Alarm bar */}
      {(dead||(cv.sys>=180||cv.sys<90)||cv.spo2<90)&&(
        <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
          {dead&&<span style={{fontFamily:'Space Mono,monospace',fontSize:9,padding:'3px 8px',borderRadius:3,color:'#E63946',border:'1px solid #E63946',background:'rgba(230,57,70,0.1)',animation:'blink 0.7s step-end infinite'}}>⚠ {rhythm==='vfib'?'FIBRILACIÓN V.':'ASISTOLIA'}</span>}
          {!dead&&cv.sys>=180&&<span style={{fontFamily:'Space Mono,monospace',fontSize:9,padding:'3px 8px',borderRadius:3,color:'#E63946',border:'1px solid #E63946'}}>HTA SEVERA</span>}
          {!dead&&cv.sys<90&&<span style={{fontFamily:'Space Mono,monospace',fontSize:9,padding:'3px 8px',borderRadius:3,color:'#3A86FF',border:'1px solid #3A86FF'}}>HIPOTENSIÓN</span>}
          {!dead&&cv.spo2<90&&<span style={{fontFamily:'Space Mono,monospace',fontSize:9,padding:'3px 8px',borderRadius:3,color:'#E63946',border:'1px solid #E63946'}}>SpO₂ BAJA</span>}
        </div>
      )}
    </div>
  );
}

// PANTALLA DE CONEXIÓN
// ══════════════════════════════════════════════════════
function ConnectScreen({onConnect,onDemo}){
  const [status,setStatus]=useState('');
  const [connecting,setConnecting]=useState(false);
  const [ip,setIp]=useState('192.168.4.1');
  const hasBLE='bluetooth' in navigator;
  const isEsp=window.location.hostname==='192.168.4.1';

  // Auto-connect si estamos en el ESP32
  useEffect(()=>{
    if(isEsp){
      setStatus('Conectando automáticamente...');
      setConnecting(true);
      const sock=new WebSocket(`ws://192.168.4.1/ws`);
      sock.onopen=()=>{setStatus('¡Conectado!');setTimeout(()=>onConnect('wifi',sock),600);};
      sock.onerror=()=>{setStatus('Error de conexión');setConnecting(false);};
    }
  },[]);

  const connectWifi=()=>{
    setConnecting(true);setStatus('Conectando por WiFi...');
    try{
      const sock=new WebSocket(`ws://${ip}/ws`);
      sock.onopen=()=>{setStatus('¡Conectado por WiFi!');setTimeout(()=>onConnect('wifi',sock),600);};
      sock.onclose=()=>{setStatus('Desconectado');setConnecting(false);};
      sock.onerror=()=>{setStatus('Error — verificá que el celular esté en la red SEM-Simulator');setConnecting(false);};
    }catch(e){setStatus('Error: '+e.message);setConnecting(false);}
  };

  const connectBLE=async()=>{
    setConnecting(true);setStatus('Buscando SEM-Sim por BLE...');
    try{
      const device=await navigator.bluetooth.requestDevice({filters:[{name:'SEM-Sim'}],optionalServices:['4fafc201-1fb5-459e-8fcc-c5c9c331914b']});
      const server=await device.gatt.connect();
      setStatus('¡Conectado por BLE!');
      setTimeout(()=>onConnect('ble',{device,server}),600);
    }catch(e){setStatus('BLE: '+e.message);setConnecting(false);}
  };

  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100vh',background:'#07090F',padding:24,gap:20}}>
      {/* Logo */}
      <div style={{textAlign:'center',marginBottom:8}}>
        <div style={{fontFamily:'Space Mono,monospace',fontSize:28,fontWeight:700,color:'#00C896',letterSpacing:'0.1em'}}>◉ SEM</div>
        <div style={{fontSize:16,color:'rgba(255,255,255,0.7)',marginTop:4}}>Simulador de Paciente</div>
        <div style={{fontFamily:'Space Mono,monospace',fontSize:10,color:'rgba(255,255,255,0.3)',marginTop:4,letterSpacing:'0.1em'}}>SOLUCIONES ELECTROMÉDICAS SJ</div>
      </div>

      {/* Mini ECG visual */}
      <div style={{width:'100%',maxWidth:300,height:60,background:'#0B1520',borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',border:'1px solid rgba(0,200,150,0.2)'}}>
        <svg viewBox="0 0 300 60" style={{width:'100%',height:'100%'}}>
          <polyline points="0,30 40,30 55,30 62,10 70,50 78,5 86,55 94,28 120,28 140,28 147,10 155,50 163,5 171,55 179,28 210,28 300,28"
            fill="none" stroke="#00C896" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
            style={{filter:'drop-shadow(0 0 4px #00C896)'}}/>
        </svg>
      </div>

      {/* Opciones de conexión */}
      {!isEsp&&(<>
        {/* WiFi */}
        <div style={{width:'100%',maxWidth:340,background:'rgba(0,200,150,0.08)',border:'1px solid rgba(0,200,150,0.25)',borderRadius:12,padding:16}}>
          <div style={{fontFamily:'Space Mono,monospace',fontSize:11,color:'#00C896',letterSpacing:'0.08em',marginBottom:10}}>📡 WIFI — SEM-Simulator</div>
          <div style={{fontSize:11,color:'rgba(255,255,255,0.5)',marginBottom:10}}>Conectá el celular a la red WiFi del ESP32, luego tocá Conectar.</div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <input value={ip} onChange={e=>setIp(e.target.value)}
              style={{flex:1,padding:'8px 12px',borderRadius:6,border:'1px solid rgba(0,200,150,0.3)',background:'rgba(0,0,0,0.4)',color:'#00C896',fontFamily:'Space Mono,monospace',fontSize:13,outline:'none'}}/>
            <button onClick={connectWifi} disabled={connecting}
              style={{padding:'8px 18px',background:'#00C896',color:'#07090F',border:'none',borderRadius:6,fontSize:13,fontWeight:700,cursor:'pointer',flexShrink:0}}>
              Conectar
            </button>
          </div>
        </div>

        {/* BLE */}
        {hasBLE&&(<div style={{width:'100%',maxWidth:340,background:'rgba(58,134,255,0.08)',border:'1px solid rgba(58,134,255,0.25)',borderRadius:12,padding:16}}>
          <div style={{fontFamily:'Space Mono,monospace',fontSize:11,color:'#3A86FF',letterSpacing:'0.08em',marginBottom:10}}>🔵 BLUETOOTH — Sin cambiar WiFi</div>
          <div style={{fontSize:11,color:'rgba(255,255,255,0.5)',marginBottom:10}}>Mantiene internet activo. Solo Chrome Android.</div>
          <button onClick={connectBLE} disabled={connecting}
            style={{width:'100%',padding:'8px',background:'#3A86FF',color:'white',border:'none',borderRadius:6,fontSize:13,fontWeight:700,cursor:'pointer'}}>
            Buscar SEM-Sim
          </button>
        </div>)}
      </>)}

      {/* Status */}
      {status&&(<div style={{fontFamily:'Space Mono,monospace',fontSize:12,color:status.includes('!')?'#00C896':status.includes('Error')||status.includes('BLE:')?'#E63946':'rgba(255,255,255,0.5)',textAlign:'center',padding:'8px 16px',borderRadius:6,background:'rgba(255,255,255,0.05)'}}>
        {connecting&&!status.includes('!')&&<span style={{marginRight:8}}>⟳</span>}{status}
      </div>)}

      {/* Demo mode */}
      <button onClick={onDemo} style={{padding:'8px 24px',background:'transparent',color:'rgba(255,255,255,0.3)',border:'1px solid rgba(255,255,255,0.15)',borderRadius:6,fontSize:12,cursor:'pointer',marginTop:8}}>
        Modo demo (sin hardware)
      </button>

      <div style={{fontFamily:'Space Mono,monospace',fontSize:9,color:'rgba(255,255,255,0.15)',textAlign:'center',marginTop:8}}>v3.0</div>
    </div>
  );
}

// MONITOR SCREEN
// ══════════════════════════════════════════════════════
function MonitorScreen({vitals,setV,cv,rhythm,setRhythm,running,ecgMode,amplitude,stOffset,cal,prog,setProg,applyProg,setScreen,ip,setIp}){
  const dead=rhythm==='vfib'||rhythm==='asistolia';
  const [wsStatus,setWsStatus]=useState('Sin conexión');
  const [wsConn,setWsConn]=useState(false);
  const [bleConn,setBleConn]=useState(false);
  const [connMode,setConnMode]=useState('wifi');
  const bleRef=useRef(null),cmdChar=useRef(null);
  const hasBLE='bluetooth' in navigator;
  const ws=useRef(null),wsRef=useRef({cv,rhythm});
  useEffect(()=>{wsRef.current={cv,rhythm};},[cv,rhythm]);
  const connect=()=>{
    try{const s=new WebSocket(`ws://${ip}/ws`);s.onopen=()=>{setWsConn(true);setWsStatus('Conectado');};
      s.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='sensors')setSensorData(d);}catch{}};s.onclose=()=>{setWsConn(false);setWsStatus('Desconectado');};s.onerror=()=>setWsStatus('Error');ws.current=s;s._iv=setInterval(()=>{if(s.readyState===WebSocket.OPEN)s.send(JSON.stringify({...wsRef.current,ts:Date.now()}));},500);}catch(e){setWsStatus('Error: '+e.message);}
  };
  const disconnect=()=>{if(ws.current){clearInterval(ws.current._iv);ws.current.close();ws.current=null;}setWsConn(false);setWsStatus('Sin conexión');};
  const connectBLE=async()=>{
    try{
      setWsStatus('Buscando SEM-Sim...');
      const device=await navigator.bluetooth.requestDevice({filters:[{name:'SEM-Sim'}],optionalServices:['4fafc201-1fb5-459e-8fcc-c5c9c331914b']});
      const server=await device.gatt.connect();
      const svc=await server.getPrimaryService('4fafc201-1fb5-459e-8fcc-c5c9c331914b');
      const vChar=await svc.getCharacteristic('beb5483e-36e1-4688-b7f5-ea07361b26a8');
      cmdChar.current=await svc.getCharacteristic('cba1d466-344c-4be3-ab3f-189f80dd7518');
      await vChar.startNotifications();
      vChar.addEventListener('characteristicvaluechanged',e=>{
        try{
          const d=JSON.parse(new TextDecoder().decode(e.target.value));
          if(d.type==='sensors') setSensorData(d);
        }catch{}
      });
      device.addEventListener('gattserverdisconnected',()=>{setBleConn(false);setWsStatus('BLE desconectado');cmdChar.current=null;});
      bleRef.current=device;
      device._iv=setInterval(async()=>{if(cmdChar.current&&server.connected)try{await cmdChar.current.writeValue(new TextEncoder().encode(JSON.stringify({...wsRef.current,ts:Date.now()})));}catch{}},500);
      setBleConn(true);setWsStatus('BLE: SEM-Sim ✓');
    }catch(e){setWsStatus('BLE: '+e.message);}
  };
  const disconnectBLE=()=>{if(bleRef.current){clearInterval(bleRef.current._iv);bleRef.current.gatt.disconnect();}cmdChar.current=null;setBleConn(false);setWsStatus('Sin conexión');};

  return(
    <div className="screen" style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}}>
      <div style={{flexShrink:0}}>
        <MonitorDisplay cv={cv} rhythm={rhythm} running={running} ecgMode={ecgMode} amplitude={amplitude} stOffset={stOffset} cal={cal}/>
      </div>
      <div style={{flex:1,overflow:'auto',background:'#F2F4F7'}}>
        <Sec icon="⚡" title="Programas clínicos" defaultOpen={true} color="#1A2535">
          <div style={{display:'flex',flexWrap:'wrap',gap:6,paddingTop:4}}>
            {PROGRAMS.map(p=>(<button key={p.id} onClick={()=>applyProg(p)} style={{padding:'6px 12px',fontSize:12,fontWeight:500,borderRadius:100,cursor:'pointer',border:prog===p.id?'none':'1px solid #E2E8F0',background:prog===p.id?p.color:'white',color:prog===p.id?'white':'#5A6B7E'}}>{p.label}</button>))}
          </div>
        </Sec>
        <Sec icon="💓" title="Ritmo ECG">
          <div style={{display:'flex',flexWrap:'wrap',gap:6,paddingTop:4}}>
            {Object.entries(RHYTHM_INFO).map(([id,info])=>{
              const sel=rhythm===id;const bg=sel?(id==='sinusal'?'#1B2A3B':id==='marcap'?'#9B59B6':['vfib','asistolia'].includes(id)?'#E63946':'#F5A623'):'white';
              return<button key={id} onClick={()=>{setRhythm(id);setProg(null);}} style={{padding:'6px 12px',fontSize:12,fontWeight:500,borderRadius:100,cursor:'pointer',border:sel?'none':'1px solid #E2E8F0',background:bg,color:sel?'white':'#5A6B7E'}}>{info.label}</button>;
            })}
          </div>
        </Sec>
        <Sec icon="🎛️" title="Parámetros">
          <div style={{paddingTop:8}}>
            <SliderRow label="FC"   value={vitals.hr}   min={20}  max={200} step={1}   unit="bpm"  onChange={v=>setV('hr',v)}/>
            <SliderRow label="SpO₂" value={vitals.spo2} min={50}  max={100} step={1}   unit="%"    onChange={v=>setV('spo2',v)}/>
            <SliderRow label="SYS"  value={vitals.sys}  min={60}  max={260} step={1}   unit="mmHg" onChange={v=>setV('sys',v)}/>
            <SliderRow label="DIA"  value={vitals.dia}  min={30}  max={160} step={1}   unit="mmHg" onChange={v=>setV('dia',v)}/>
            <SliderRow label="TEMP" value={vitals.temp} min={32}  max={42}  step={0.1} unit="°C"   onChange={v=>setV('temp',v)}/>
            <SliderRow label="RESP" value={vitals.resp} min={4}   max={60}  step={1}   unit="rpm"  onChange={v=>setV('resp',v)}/>
          </div>
        </Sec>
        <Sec icon="📡" title="Conexión ESP32">
          <div style={{paddingTop:8}}>
            {/* Mode selector */}
            <div style={{display:'flex',gap:6,marginBottom:12}}>
              {[['wifi','📡 WiFi (http://192.168.4.1)'],['ble','🔵 BLE (mantiene internet)']].map(([m,lbl])=>(
                <button key={m} onClick={()=>setConnMode(m)} style={{flex:1,padding:'6px 4px',fontSize:11,fontWeight:500,borderRadius:6,cursor:'pointer',border:connMode===m?'none':'1px solid #E2E8F0',background:connMode===m?'#1B2A3B':'white',color:connMode===m?'#00C896':'#5A6B7E'}}>{lbl}</button>
              ))}
            </div>

            {connMode==='wifi'&&(<div>
              <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:8}}>
                <div style={{width:8,height:8,borderRadius:'50%',background:wsConn?'#00C896':'#555',boxShadow:wsConn?'0 0 6px #00C896':'none',flexShrink:0}}/>
                <input value={ip} onChange={e=>setIp(e.target.value)} disabled={wsConn}
                  style={{flex:1,padding:'7px 10px',border:'1px solid #E2E8F0',borderRadius:6,fontSize:13,fontFamily:'Space Mono,monospace',outline:'none'}}/>
                <button onClick={wsConn?disconnect:connect} style={{padding:'7px 14px',fontSize:12,background:wsConn?'#E63946':'#00C896',color:'white',border:'none',borderRadius:6,cursor:'pointer',fontWeight:600,flexShrink:0}}>
                  {wsConn?'Desconectar':'Conectar'}
                </button>
              </div>
              <div style={{fontSize:11,color:'#aaa'}}>Conectate al WiFi "SEM-Simulator" primero, luego abrí http://192.168.4.1</div>
            </div>)}

            {connMode==='ble'&&(<div>
              {!hasBLE&&<div style={{fontSize:12,color:'#E63946',padding:'8px',background:'rgba(230,57,70,0.08)',borderRadius:6,border:'1px solid rgba(230,57,70,0.2)'}}>Web Bluetooth no disponible. Usá Chrome en Android.</div>}
              {hasBLE&&(<div style={{display:'flex',gap:8,alignItems:'center',marginBottom:8}}>
                <div style={{width:8,height:8,borderRadius:'50%',background:bleConn?'#3A86FF':'#555',boxShadow:bleConn?'0 0 6px #3A86FF':'none',flexShrink:0}}/>
                <span style={{flex:1,fontSize:13,color:bleConn?'#3A86FF':'#5A6B7E',fontFamily:'Space Mono,monospace'}}>SEM-Sim</span>
                <button onClick={bleConn?disconnectBLE:connectBLE} style={{padding:'7px 14px',fontSize:12,background:bleConn?'#E63946':'#3A86FF',color:'white',border:'none',borderRadius:6,cursor:'pointer',fontWeight:600}}>
                  {bleConn?'Desconectar':'Buscar'}
                </button>
              </div>)}
              <div style={{fontSize:11,color:'#aaa'}}>Sin cambiar WiFi — mantiene internet activo</div>
            </div>)}

            <div style={{fontSize:11,color:'#5A6B7E',marginTop:8}}>{wsStatus}</div>
          </div>
        </Sec>
      </div>
    </div>
  );
}

        </Sec>

    </div>
  );
}

// ══════════════════════════════════════════════════════
// CALIBRACIÓN, VERIFICACIÓN, INFORME (igual que antes)
// ══════════════════════════════════════════════════════
function calcStat(errors){if(!errors.length)return null;const m=errors.reduce((a,b)=>a+b,0)/errors.length;const sd=Math.sqrt(errors.reduce((a,b)=>a+Math.pow(b-m,2),0)/errors.length);return{mean:m,sd,passM:Math.abs(m)<=5,passSd:sd<=8,pass:Math.abs(m)<=5&&sd<=8};}
const errClr=v=>{const a=Math.abs(v);return a<=3?'#00C896':a<=8?'#F5A623':'#E63946';};
const fmt=(v,d=1)=>isNaN(v)?'—':`${v>0?'+':''}${v.toFixed(d)}`;

function VerifScreen({vitals, sensorData}){
  const [param,setParam]=useState('nibp');
  const [meas,setMeas]=useState([]);
  const [e,setE]=useState({tSys:'',tDia:'',mSys:'',mDia:'',tSpo2:'',mSpo2:'',tTemp:'',mTemp:'',tHr:'',mHr:''});
  useEffect(()=>{setE(p=>({...p,tSys:String(vitals.sys),tDia:String(vitals.dia),tSpo2:String(vitals.spo2),tTemp:String(vitals.temp),tHr:String(vitals.hr)}));},[vitals]);
  // Auto-cargar temperatura real del DS18B20 cuando llega del ESP32
  useEffect(()=>{
    if(sensorData&&sensorData.tempRef&&sensorData.tempRef>0){
      setE(p=>({...p,tTemp:String(sensorData.tempRef)}));
    }
  },[sensorData]);
  const add=()=>{setMeas(p=>[...p,{id:Date.now(),param,...e}]);setE(p=>({...p,mSys:'',mDia:'',mSpo2:'',mTemp:'',mHr:''}));};
  const del=id=>setMeas(p=>p.filter(m=>m.id!==id));
  const fil=meas.filter(m=>m.param===param);
  const sysE=fil.map(m=>parseFloat(m.mSys)-parseFloat(m.tSys)).filter(v=>!isNaN(v));
  const diaE=fil.map(m=>parseFloat(m.mDia)-parseFloat(m.tDia)).filter(v=>!isNaN(v));
  const Th=({c})=><th style={{padding:'6px 8px',fontSize:10,fontWeight:600,color:'#5A6B7E',textTransform:'uppercase',textAlign:'center'}}>{c}</th>;
  const Td=({c,s})=><td style={{padding:'6px 8px',textAlign:'center',fontFamily:'Space Mono,monospace',fontSize:12,...s}}>{c}</td>;
  return(
    <div className="screen" style={{height:'100%',overflow:'auto',background:'#F2F4F7',padding:14}}>
      <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
        {[['nibp','NIBP'],['spo2','SpO₂'],['temp','Temp'],['hr','FC']].map(([id,lbl])=>(
          <button key={id} onClick={()=>setParam(id)} style={{padding:'7px 16px',fontSize:12,fontWeight:500,borderRadius:100,cursor:'pointer',border:param===id?'none':'1px solid #E2E8F0',background:param===id?'#00C896':'white',color:param===id?'white':'#5A6B7E'}}>{lbl}</button>
        ))}
      </div>
      <div style={{background:'white',border:'1px solid #E2E8F0',borderRadius:8,padding:14,marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:600,color:'#5A6B7E',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:10}}>Nueva medición</div>
        {param==='nibp'&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr auto',gap:8,alignItems:'end'}}>
          {[['tSys','T-SYS'],['tDia','T-DIA'],['mSys','M-SYS'],['mDia','M-DIA']].map(([k,l])=>(<div key={k}><label style={LBL}>{l}</label><input type="number" value={e[k]} onChange={ev=>setE({...e,[k]:ev.target.value})} style={INP}/></div>))}
          <button onClick={add} style={{padding:'7px 14px',background:'#00C896',color:'white',border:'none',borderRadius:6,fontSize:16,cursor:'pointer',fontWeight:700,height:36,alignSelf:'end'}}>+</button>
        </div>}
        {param==='spo2'&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr auto',gap:8,alignItems:'end'}}>
          {[['tSpo2','Target %'],['mSpo2','Medido %']].map(([k,l])=>(<div key={k}><label style={LBL}>{l}</label><input type="number" value={e[k]} onChange={ev=>setE({...e,[k]:ev.target.value})} style={INP}/></div>))}
          <button onClick={add} style={{padding:'7px 14px',background:'#00C896',color:'white',border:'none',borderRadius:6,fontSize:16,cursor:'pointer',fontWeight:700,height:36,alignSelf:'end'}}>+</button>
          </div>
        </div>}
        {param==='temp'&&<div>
          {sensorData&&sensorData.tempRef>0&&<div style={{padding:'6px 12px',background:'rgba(0,200,150,0.08)',border:'1px solid rgba(0,200,150,0.25)',borderRadius:6,fontSize:11,color:'#00C896',marginBottom:8,fontFamily:'Space Mono,monospace'}}>
            📡 DS18B20: <b>{sensorData.tempRef.toFixed(1)}°C</b> — cargado como referencia
          </div>}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr auto',gap:8,alignItems:'end'}}>
          {[['tTemp','Ref °C (DS18B20)'],['mTemp','Monitor °C']].map(([k,l])=>(<div key={k}><label style={LBL}>{l}</label><input type="number" step="0.1" value={e[k]} onChange={ev=>setE({...e,[k]:ev.target.value})} style={INP}/></div>))}
          <button onClick={add} style={{padding:'7px 14px',background:'#00C896',color:'white',border:'none',borderRadius:6,fontSize:16,cursor:'pointer',fontWeight:700,height:36,alignSelf:'end'}}>+</button>
        </div>}
        {param==='hr'&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr auto',gap:8,alignItems:'end'}}>
          {[['tHr','Target bpm'],['mHr','Medido bpm']].map(([k,l])=>(<div key={k}><label style={LBL}>{l}</label><input type="number" value={e[k]} onChange={ev=>setE({...e,[k]:ev.target.value})} style={INP}/></div>))}
          <button onClick={add} style={{padding:'7px 14px',background:'#00C896',color:'white',border:'none',borderRadius:6,fontSize:16,cursor:'pointer',fontWeight:700,height:36,alignSelf:'end'}}>+</button>
        </div>}
      </div>
      {fil.length>0&&<>
        <div style={{background:'white',border:'1px solid #E2E8F0',borderRadius:8,overflow:'hidden',marginBottom:12}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12}}>
            <thead><tr style={{background:'#F8F9FB'}}><Th c="#"/>
              {param==='nibp'&&<><Th c="T-SYS"/><Th c="T-DIA"/><Th c="M-SYS"/><Th c="M-DIA"/><Th c="Δ SYS"/><Th c="Δ DIA"/></>}
              {param==='spo2'&&<><Th c="Target"/><Th c="Medido"/><Th c="Δ"/></>}
              {param==='temp'&&<><Th c="Ref."/><Th c="Monitor"/><Th c="Δ"/></>}
              {param==='hr'&&<><Th c="Target"/><Th c="Medido"/><Th c="Δ"/></>}
              <Th c=""/>
            </tr></thead>
            <tbody>{fil.map((m,i)=>{
              const sE2=parseFloat(m.mSys)-parseFloat(m.tSys),dE2=parseFloat(m.mDia)-parseFloat(m.tDia);
              const spE=parseFloat(m.mSpo2)-parseFloat(m.tSpo2),tpE=parseFloat(m.mTemp)-parseFloat(m.tTemp),hrE=parseFloat(m.mHr)-parseFloat(m.tHr);
              return<tr key={m.id} style={{borderTop:'1px solid #F0F0F0'}}>
                <Td c={i+1} s={{textAlign:'left',paddingLeft:12,color:'#aaa'}}/>
                {param==='nibp'&&<><Td c={m.tSys}/><Td c={m.tDia}/><Td c={m.mSys} s={{fontWeight:700}}/><Td c={m.mDia} s={{fontWeight:700}}/><Td c={fmt(sE2)} s={{fontWeight:600,color:errClr(sE2)}}/><Td c={fmt(dE2)} s={{fontWeight:600,color:errClr(dE2)}}/></>}
                {param==='spo2'&&<><Td c={m.tSpo2+'%'}/><Td c={m.mSpo2+'%'} s={{fontWeight:700}}/><Td c={fmt(spE)+'%'} s={{fontWeight:600,color:errClr(spE*3)}}/></>}
                {param==='temp'&&<><Td c={m.tTemp+'°C'}/><Td c={m.mTemp+'°C'} s={{fontWeight:700}}/><Td c={fmt(tpE,2)+'°C'} s={{fontWeight:600,color:errClr(Math.abs(tpE)*15)}}/></>}
                {param==='hr'&&<><Td c={m.tHr}/><Td c={m.mHr} s={{fontWeight:700}}/><Td c={fmt(hrE)} s={{fontWeight:600,color:errClr(hrE)}}/></>}
                <td style={{padding:'6px',textAlign:'center'}}><button onClick={()=>del(m.id)} style={{background:'none',border:'none',cursor:'pointer',color:'#ccc',fontSize:18}}>×</button></td>
              </tr>;
            })}</tbody>
          </table>
        </div>
        {param==='nibp'&&sysE.length>0&&(()=>{const ss=calcStat(sysE),ds=calcStat(diaE),pass=ss?.pass&&ds?.pass;return(
          <div style={{background:'white',border:'1px solid #E2E8F0',borderRadius:8,padding:14}}>
            <div style={{fontSize:11,fontWeight:600,color:'#5A6B7E',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:10}}>Estadísticas NIBP — AAMI SP10</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}}>
              {[{l:'Error medio SYS',v:fmt(ss?.mean),ok:ss?.passM},{l:'DS SYS',v:fmt(ss?.sd),ok:ss?.passSd}].map(x=>(<div key={x.l}><div style={{fontSize:10,color:'#aaa',textTransform:'uppercase',marginBottom:2}}>{x.l}</div><div style={{fontFamily:'Space Mono,monospace',fontSize:18,fontWeight:700,color:x.ok?'#00C896':'#E63946'}}>{x.v} mmHg</div></div>))}
            </div>
            <div style={{padding:'10px 14px',borderRadius:6,display:'flex',alignItems:'center',gap:10,background:pass?'rgba(0,200,150,0.08)':'rgba(230,57,70,0.08)',border:`1px solid ${pass?'rgba(0,200,150,0.3)':'rgba(230,57,70,0.3)'}`}}>
              <span style={{fontSize:18}}>{pass?'✅':'❌'}</span>
              <div><div style={{fontWeight:700,color:pass?'#00C896':'#E63946'}}>{pass?'APROBADO':'REPROBADO'}</div>
              <div style={{fontSize:11,color:'#aaa'}}>n={sysE.length}{sysE.length<5?' · ⚠ mín. 5':''}</div></div>
            </div>
          </div>
        );})()}
      </>}
      {fil.length===0&&<div style={{textAlign:'center',padding:30,color:'#aaa'}}>Sin mediciones para {param.toUpperCase()}.</div>}
    </div>
  );
}

function CalScreen({cal,setCal}){
  const [param,setParam]=useState('nibp');
  const [entry,setEntry]=useState({nominal:'',reference:''});
  const cfg=PARAM_CFG[param],p=cal[param];
  const setInstr=(k,v)=>setCal(prev=>({...prev,[param]:{...prev[param],instrument:{...prev[param].instrument,[k]:v}}}));
  const setMeta=(k,v)=>setCal(prev=>({...prev,[param]:{...prev[param],[k]:v}}));
  const addPoint=()=>{const nom=parseFloat(entry.nominal),ref=parseFloat(entry.reference);if(isNaN(nom)||isNaN(ref))return;setCal(prev=>({...prev,[param]:{...prev[param],points:[...prev[param].points,{id:Date.now(),nominal:nom,reference:ref,error:ref-nom}]}}));setEntry({nominal:'',reference:''});};
  const removePoint=id=>setCal(prev=>({...prev,[param]:{...prev[param],points:prev[param].points.filter(pt=>pt.id!==id)}}));
  const applyCorrection=()=>{if(!p.points.length)return;if(cfg.tipo==='gain'){const g=p.points.reduce((a,pt)=>a+pt.reference/pt.nominal,0)/p.points.length;setCal(prev=>({...prev,[param]:{...prev[param],gain:parseFloat(g.toFixed(4)),applied:true,date:new Date().toISOString().split('T')[0]}}));}else{const o=p.points.reduce((a,pt)=>a+pt.error,0)/p.points.length;setCal(prev=>({...prev,[param]:{...prev[param],offset:parseFloat(o.toFixed(3)),applied:true,date:new Date().toISOString().split('T')[0]}}));}};
  const clear=()=>setCal(prev=>({...prev,[param]:{...defaultCalP}}));
  const mean=p.points.length?p.points.reduce((a,pt)=>a+pt.error,0)/p.points.length:null;
  const calCount=['nibp','temp','ecg','spo2'].filter(k=>cal[k].applied).length;
  return(
    <div className="screen" style={{height:'100%',overflow:'auto',background:'#F2F4F7',padding:14}}>
      <div style={{marginBottom:14,padding:'12px 14px',borderRadius:8,border:`1px solid ${calCount===4?'rgba(0,200,150,0.3)':calCount>0?'rgba(245,166,35,0.3)':'rgba(100,100,100,0.2)'}`,background:calCount===4?'rgba(0,200,150,0.06)':calCount>0?'rgba(245,166,35,0.06)':'rgba(0,0,0,0.02)',display:'flex',alignItems:'center',gap:10}}>
        <span style={{fontSize:20}}>{calCount===4?'✅':calCount>0?'⚠️':'⭕'}</span>
        <div>
          <div style={{fontWeight:600,fontSize:13,color:calCount===4?'#00C896':calCount>0?'#F5A623':'#5A6B7E'}}>{calCount===4?'Todos calibrados':calCount>0?`${calCount}/4 parámetros calibrados`:'Sin calibración activa'}</div>
          <div style={{fontSize:11,color:'#5A6B7E',marginTop:2}}>
            {['nibp','temp','ecg','spo2'].map(k=><span key={k} style={{marginRight:8,color:cal[k].applied?'#00C896':'#aaa'}}>{PARAM_CFG[k].label.split(' ')[0]}: {cal[k].applied?cal[k].date||'✓':'—'}</span>)}
          </div>
        </div>
      </div>
      <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
        {Object.entries(PARAM_CFG).map(([id,c])=>(
          <button key={id} onClick={()=>setParam(id)} style={{padding:'7px 14px',fontSize:12,fontWeight:500,borderRadius:8,cursor:'pointer',border:param===id?'none':'1px solid #E2E8F0',background:param===id?'#1B2A3B':'white',color:param===id?'#00C896':'#5A6B7E',display:'flex',alignItems:'center',gap:5}}>
            {c.label.split(' ')[0]}
            <span style={{fontSize:8,fontFamily:'Space Mono,monospace',padding:'1px 4px',borderRadius:3,background:cal[id].applied?'rgba(0,200,150,0.2)':'rgba(0,0,0,0.05)',color:cal[id].applied?'#00C896':'#aaa'}}>{cal[id].applied?'CAL':'—'}</span>
          </button>
        ))}
      </div>
      <div style={{background:'white',border:'1px solid #E2E8F0',borderRadius:8,padding:14,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:600,color:'#5A6B7E',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:10}}>Instrumento patrón</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
          {[['marca','Marca'],['modelo','Modelo'],['serie','N° Serie'],['cert','N° Cert.']].map(([k,l])=>(<div key={k}><label style={LBL}>{l}</label><input value={p.instrument[k]||''} onChange={ev=>setInstr(k,ev.target.value)} style={{...INP,fontFamily:'Inter,sans-serif'}}/></div>))}
        </div>
        <div><label style={LBL}>Trazabilidad</label><input value={p.instrument.trazabilidad||''} onChange={ev=>setInstr('trazabilidad',ev.target.value)} style={{...INP,fontFamily:'Inter,sans-serif'}}/></div>
      </div>
      <div style={{background:'white',border:'1px solid #E2E8F0',borderRadius:8,padding:14,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:600,color:'#5A6B7E',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:10}}>Puntos de calibración — {cfg.label}</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr auto',gap:8,alignItems:'end',marginBottom:14}}>
          <div><label style={LBL}>{cfg.nomLabel}</label><input type="number" step={cfg.step||1} value={entry.nominal} onChange={ev=>setEntry({...entry,nominal:ev.target.value})} style={INP}/></div>
          <div><label style={LBL}>{cfg.refLabel}</label><input type="number" step={cfg.step||0.1} value={entry.reference} onChange={ev=>setEntry({...entry,reference:ev.target.value})} onKeyDown={ev=>ev.key==='Enter'&&addPoint()} style={INP}/></div>
          <button onClick={addPoint} style={{padding:'7px 14px',background:'#1B2A3B',color:'#00C896',border:'1px solid #00C89640',borderRadius:6,fontSize:16,cursor:'pointer',fontWeight:700,height:36,alignSelf:'end'}}>+</button>
        </div>
        {p.points.length>0&&<>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:12,marginBottom:12}}>
            <thead><tr style={{background:'#F8F9FB'}}>
              {['#','Nominal','Patrón','Error','Estado'].map(h=><th key={h} style={{padding:'5px 8px',fontSize:10,fontWeight:600,color:'#5A6B7E',textTransform:'uppercase',textAlign:'center'}}>{h}</th>)}
              <th/>
            </tr></thead>
            <tbody>{p.points.map((pt,i)=>{const ok=Math.abs(pt.error)<=cfg.tol*3;return(
              <tr key={pt.id} style={{borderBottom:'1px solid #F0F0F0'}}>
                <td style={{padding:'5px 8px',textAlign:'center',color:'#aaa',fontFamily:'Space Mono,monospace',fontSize:11}}>{i+1}</td>
                <td style={{padding:'5px 8px',textAlign:'center',fontFamily:'Space Mono,monospace',fontSize:11}}>{pt.nominal} {cfg.unit}</td>
                <td style={{padding:'5px 8px',textAlign:'center',fontFamily:'Space Mono,monospace',fontSize:11,fontWeight:700}}>{pt.reference} {cfg.unit}</td>
                <td style={{padding:'5px 8px',textAlign:'center',fontFamily:'Space Mono,monospace',fontSize:11,color:ok?'#00C896':'#E63946'}}>{fmt(pt.error,3)} {cfg.unit}</td>
                <td style={{padding:'5px 8px',textAlign:'center'}}><span style={{fontFamily:'Space Mono,monospace',fontSize:9,padding:'2px 6px',borderRadius:3,background:ok?'rgba(0,200,150,0.1)':'rgba(230,57,70,0.1)',color:ok?'#00C896':'#E63946'}}>{ok?'OK':'FALLA'}</span></td>
                <td style={{padding:'5px',textAlign:'center'}}><button onClick={()=>removePoint(pt.id)} style={{background:'none',border:'none',cursor:'pointer',color:'#ccc',fontSize:16}}>×</button></td>
              </tr>);
            })}</tbody>
          </table>
          {mean!==null&&<div style={{background:'#F8F9FB',borderRadius:6,padding:10,marginBottom:12,display:'flex',gap:20}}>
            <div><div style={{fontSize:10,color:'#aaa',textTransform:'uppercase',marginBottom:2}}>Error medio</div><div style={{fontFamily:'Space Mono,monospace',fontSize:16,fontWeight:700,color:'#1A2535'}}>{fmt(mean,3)} {cfg.unit}</div></div>
            <div><div style={{fontSize:10,color:'#aaa',textTransform:'uppercase',marginBottom:2}}>Corrección</div><div style={{fontFamily:'Space Mono,monospace',fontSize:16,fontWeight:700,color:'#1A2535'}}>{cfg.tipo==='gain'?(p.points.reduce((a,pt)=>a+pt.reference/pt.nominal,0)/p.points.length).toFixed(4):fmt(mean,3)+' '+cfg.unit}</div></div>
          </div>}
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button onClick={applyCorrection} style={{padding:'8px 16px',background:'#00C896',color:'white',border:'none',borderRadius:6,fontSize:13,cursor:'pointer',fontWeight:600}}>✓ Aplicar corrección</button>
            <button onClick={clear} style={{padding:'8px 14px',background:'white',color:'#5A6B7E',border:'1px solid #E2E8F0',borderRadius:6,fontSize:13,cursor:'pointer'}}>↺ Limpiar</button>
          </div>
        </>}
        {p.points.length===0&&<div style={{textAlign:'center',padding:'16px 0',color:'#aaa',fontSize:13}}>Ingresá al menos 3 puntos para aplicar corrección.</div>}
      </div>
      {p.applied&&<div style={{background:'rgba(0,200,150,0.06)',border:'1px solid rgba(0,200,150,0.25)',borderRadius:8,padding:'12px 14px',marginBottom:12,display:'flex',alignItems:'center',gap:10}}>
        <span style={{fontSize:18}}>✅</span>
        <div>
          <div style={{fontWeight:600,color:'#00C896',fontSize:13}}>Corrección activa — {cfg.label}</div>
          <div style={{fontSize:11,color:'#5A6B7E',marginTop:2}}>{cfg.tipo==='gain'?`Ganancia: ×${p.gain.toFixed(4)}`:`Offset: ${fmt(p.offset,3)} ${cfg.unit}`} {p.date&&`· ${p.date}`}</div>
        </div>
      </div>}
      <div style={{background:'white',border:'1px solid #E2E8F0',borderRadius:8,padding:14,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:600,color:'#5A6B7E',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:10}}>Datos del registro</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <div><label style={LBL}>Técnico</label><input value={p.tecnico||''} onChange={ev=>setMeta('tecnico',ev.target.value)} style={{...INP,fontFamily:'Inter,sans-serif'}}/></div>
          <div><label style={LBL}>Fecha</label><input type="date" value={p.date||''} onChange={ev=>setMeta('date',ev.target.value)} style={{...INP,fontFamily:'Inter,sans-serif'}}/></div>
          <div style={{gridColumn:'1/-1'}}><label style={LBL}>Próxima calibración</label><input type="date" value={p.nextDate||''} onChange={ev=>setMeta('nextDate',ev.target.value)} style={{...INP,fontFamily:'Inter,sans-serif'}}/></div>
        </div>
      </div>
      <button onClick={()=>window.print()} style={{width:'100%',padding:'12px',background:'#1B2A3B',color:'white',border:'none',borderRadius:8,fontSize:14,cursor:'pointer',fontWeight:600}}>🖨 Certificado de calibración</button>
    </div>
  );
}

function InformeScreen({eq,setEq}){
  const fecha=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'long',year:'numeric'});
  return(
    <div className="screen" style={{height:'100%',overflow:'auto',background:'#F2F4F7',padding:14}}>
      <div style={{background:'white',border:'1px solid #E2E8F0',borderRadius:8,padding:14,marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:600,color:'#5A6B7E',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:10}}>Datos del equipo</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {[['marca','Marca'],['modelo','Modelo'],['serie','N° Serie'],['cliente','Cliente'],['tecnico','Técnico'],['ot','N° OT']].map(([k,l])=>(<div key={k}><label style={LBL}>{l}</label><input value={eq[k]||''} onChange={ev=>setEq(p=>({...p,[k]:ev.target.value}))} style={{...INP,fontFamily:'Inter,sans-serif'}}/></div>))}
        </div>
      </div>
      <button onClick={()=>window.print()} style={{width:'100%',padding:'12px',background:'#1B2A3B',color:'white',border:'none',borderRadius:8,fontSize:14,cursor:'pointer',fontWeight:600,marginBottom:14}}>🖨 Imprimir informe</button>
      <div id="print-area" style={{background:'white',border:'1px solid #E2E8F0',borderRadius:8,padding:24}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14}}>
          <div>
            <div style={{fontFamily:'Space Mono,monospace',fontSize:9,letterSpacing:'0.15em',color:'#aaa',textTransform:'uppercase'}}>Soluciones Electromédicas SJ — SEM</div>
            <div style={{fontSize:18,fontWeight:700,color:'#1A2535',marginTop:3}}>Informe de Verificación</div>
            <div style={{fontSize:12,color:'#5A6B7E'}}>SEM Simulator v3.0</div>
          </div>
          <div style={{textAlign:'right'}}><div style={{fontFamily:'Space Mono,monospace',fontSize:11,fontWeight:700}}>{fecha}</div>{eq.ot&&<div style={{fontFamily:'Space Mono,monospace',fontSize:10,color:'#aaa'}}>OT #{eq.ot}</div>}</div>
        </div>
        <div style={{height:1,background:'#E2E8F0',margin:'12px 0'}}/>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'6px 24px',marginBottom:12}}>
          {[['Marca',eq.marca],['Modelo',eq.modelo],['N° Serie',eq.serie],['Cliente',eq.cliente],['Técnico',eq.tecnico]].map(([l,v])=>(<div key={l} style={{display:'flex',gap:8,fontSize:12}}><span style={{color:'#5A6B7E',minWidth:70}}>{l}:</span><span style={{fontWeight:600}}>{v||'—'}</span></div>))}
        </div>
        <div style={{height:1,background:'#E2E8F0',margin:'12px 0'}}/>
        <div style={{fontSize:11,color:'#aaa',lineHeight:1.6,marginBottom:24}}>Verificación realizada con SEM Simulator v3.0 calibrado. Criterios: NIBP → AAMI SP10/ISO 81060-2 · SpO₂ → ISO 9919 · Temperatura → IEC 60601-2-56.</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:40,marginTop:40}}>
          <div style={{borderTop:'1px solid #ccc',paddingTop:8,fontSize:12,color:'#aaa'}}>Firma y sello del técnico</div>
          <div style={{borderTop:'1px solid #ccc',paddingTop:8,fontSize:12,color:'#aaa'}}>Conformidad del cliente</div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════
// APP PRINCIPAL
// ══════════════════════════════════════════════════════
function App(){
  const [screen,setScreen]=useState('home');
  const [appReady,setAppReady]=useState(false);
  const [sensorData,setSensorData]=useState({tempRef:null,pressure:0,battery:0});
  const [connMode,setConnMode]=useState('demo');
  const wsAppRef=useRef(null);
  const [rhythm,setRhythm]=useState('sinusal');
  const [running,setRunning]=useState(true);
  const [prog,setProg]=useState('normal');
  const [vitals,setVitals]=useState({hr:72,spo2:98,sys:120,dia:80,temp:36.6,resp:16});
  const [ecgMode,setEcgMode]=useState('cardiaco');
  const [amplitude,setAmplitude]=useState(1.0);
  const [stOffset,setStOffset]=useState(0.0);
  const [spo2Brand,setSpo2Brand]=useState('nellcor');
  const [eq,setEq]=useState({marca:'',modelo:'',serie:'',cliente:'',tecnico:'',ot:''});
  const [cal,setCal]=useState(()=>{try{return JSON.parse(localStorage.getItem('sem_cal'))||defaultCal;}catch{return defaultCal;}});
  const [ip,setIp]=useState('192.168.4.1');
  useEffect(()=>{localStorage.setItem('sem_cal',JSON.stringify(cal));},[cal]);

  // Manejar conexión desde ConnectScreen
  const handleConnect=(mode,conn)=>{
    setConnMode(mode);
    if(mode==='wifi'&&conn){
      wsAppRef.current=conn;
      conn._iv=setInterval(()=>{
        if(conn.readyState===WebSocket.OPEN){
          conn.send(JSON.stringify({...correctedVitals,rhythm,ecgMode,amplitude:correctedAmplitude,stOffset,running,ts:Date.now()}));
        }
      },500);
      conn.onclose=()=>{setConnMode('demo');};
    }
    setAppReady(true);
  };
  const handleDemo=()=>{setConnMode('demo');setAppReady(true);};

  const setV=(k,v)=>{setVitals(prev=>({...prev,[k]:v}));setProg(null);};
  const applyProg=p=>{setVitals({hr:p.hr,spo2:p.spo2,sys:p.sys,dia:p.dia,temp:p.temp,resp:p.resp});setRhythm(p.rhythm);setProg(p.id);};

  // Corrected values
  const cv={
    ...vitals,
    sys:Math.round(vitals.sys+(cal.nibp.applied?cal.nibp.offset:0)),
    dia:Math.round(vitals.dia+(cal.nibp.applied?cal.nibp.offset:0)),
    temp:parseFloat((vitals.temp+(cal.temp.applied?cal.temp.offset:0)).toFixed(1)),
    spo2:Math.round(vitals.spo2+(cal.spo2.applied?cal.spo2.offset:0)),
  };
  const corrAmp=amplitude*(cal.ecg.applied?cal.ecg.gain:1);
  const anyCal=cal.nibp.applied||cal.temp.applied||cal.ecg.applied||cal.spo2.applied;

  const SCREEN_TITLES={home:'SEM Simulator',monitor:'Monitor Multiparamétrico',spo2:'Saturometría SpO₂',ecg:'ECG / Calibración',cal:'Calibración',verif:'Verificación',informe:'Informe'};

  if(!appReady) return <ConnectScreen onConnect={handleConnect} onDemo={handleDemo}/>;

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh',background:'#07090F'}}>
      {/* HEADER */}
      <div id="app-header" style={{background:'#0B1520',padding:'0 16px',height:52,display:'flex',alignItems:'center',gap:10,flexShrink:0,borderBottom:'1px solid #1A2535'}}>
        {screen!=='home'?(
          <button onClick={()=>setScreen('home')} style={{background:'none',border:'none',cursor:'pointer',color:'#00C896',fontSize:22,lineHeight:1,padding:'4px 6px 4px 0',display:'flex',alignItems:'center'}}>←</button>
        ):(
          <span style={{fontFamily:'Space Mono,monospace',fontSize:13,fontWeight:700,color:'#00C896',letterSpacing:'0.08em'}}>◉ SEM</span>
        )}
        <span style={{fontSize:13,color:'rgba(255,255,255,0.7)',fontWeight:500,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
          {SCREEN_TITLES[screen]||screen}
        </span>
        {anyCal&&screen==='home'&&<span style={{fontFamily:'Space Mono,monospace',fontSize:8,color:'#00C896',border:'1px solid #00C89640',padding:'2px 6px',borderRadius:3,flexShrink:0}}>CAL</span>}
        <button onClick={()=>setRunning(!running)} style={{padding:'5px 14px',fontSize:11,fontFamily:'Space Mono,monospace',fontWeight:700,background:running?'rgba(230,57,70,0.15)':'rgba(0,200,150,0.15)',color:running?'#E63946':'#00C896',border:`1px solid ${running?'#E63946':'#00C896'}`,borderRadius:4,cursor:'pointer',flexShrink:0}}>
          {running?'⏸':'▶'}
        </button>
      </div>

      {/* SCREENS */}
      <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
        {screen==='home'&&<HomeScreen cv={cv} rhythm={rhythm} running={running} ecgMode={ecgMode} amplitude={corrAmp} stOffset={stOffset} cal={cal} anyCal={anyCal} setScreen={setScreen}/>}
        {screen==='monitor'&&<MonitorScreen vitals={vitals} setV={setV} cv={cv} rhythm={rhythm} setRhythm={setRhythm} running={running} ecgMode={ecgMode} amplitude={corrAmp} stOffset={stOffset} cal={cal} prog={prog} setProg={setProg} applyProg={applyProg} setScreen={setScreen} ip={ip} setIp={setIp}/>}
        {screen==='spo2'&&<Spo2Screen vitals={vitals} setV={setV} cv={cv} rhythm={rhythm} setRhythm={setRhythm} running={running} ecgMode={ecgMode} amplitude={corrAmp} stOffset={stOffset} cal={cal} brand={spo2Brand} setBrand={setSpo2Brand}/>}
        {screen==='ecg'&&<EcgScreen vitals={vitals} setV={setV} cv={cv} rhythm={rhythm} setRhythm={setRhythm} running={running} ecgMode={ecgMode} setEcgMode={setEcgMode} amplitude={amplitude} setAmplitude={setAmplitude} stOffset={stOffset} setStOffset={setStOffset} cal={cal} prog={prog} setProg={setProg} applyProg={applyProg}/>}
        {screen==='cal'&&<CalScreen cal={cal} setCal={setCal}/>}
        {screen==='verif'&&<VerifScreen vitals={{hr:cv.hr,spo2:cv.spo2,sys:cv.sys,dia:cv.dia,temp:cv.temp}} sensorData={sensorData}/>}
        {screen==='informe'&&<InformeScreen eq={eq} setEq={setEq}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script>
</body>
</html>
