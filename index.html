<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SEM Sim">
<meta name="theme-color" content="#0B1520">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>SEM Simulator</title>
<script src="/vendor/react.production.min.js" crossorigin></script>
<script src="/vendor/react-dom.production.min.js" crossorigin></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#07090F}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
@keyframes blink{50%{opacity:0.15}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:#1E2D3D;outline:none;width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#00C896;cursor:pointer;box-shadow:0 0 8px rgba(0,200,150,0.5)}
.screen{animation:fadeIn 0.18s ease}
@media print{
  #app-header,#home-screen,#nav-back{display:none!important}
  #print-area,#cert-area{border:none!important;padding:0!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="/app.js"></script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));</script>
</body>
</html>
